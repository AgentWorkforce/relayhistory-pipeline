# PostgREST for session directory search on self-hosted Postgres. See README.md.
# The test suite in integration/session-directory-postgrest loads this file, with
# only the db-uri, server-port and admin-server-port lines replaced.
db-uri = "$(PGRST_DB_URI)"
db-schemas = "sessions"
# No db-anon-role: a request with no valid token is refused, not run as anon.
jwt-secret = "@/etc/postgrest/session-directory-jwks.json"
jwt-aud = "session-directory-search"
server-port = 3000
admin-server-port = 3001
