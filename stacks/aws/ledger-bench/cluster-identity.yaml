AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  ledger-bench (throwaway): the benchmark pod's identity in the EKS cluster's account
  (docs/design/hosted-ledger-benchmark-plan.md). One role that EKS Pod Identity hands to the
  ledger-bench ServiceAccount in the ledger-bench namespace, and whose only permission is to assume the
  client role in the throwaway account. It can reach no bucket, key or table in this account.
  Delete the stack to remove it.

Parameters:
  ClusterName:
    Type: String
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$"
  DataAccountId:
    Type: String
    AllowedPattern: "^[0-9]{12}$"
    Description: The throwaway (sessions-dev) account that holds the ledger-bench-client role.
  PodRoleName:
    Type: String
    Default: ledger-bench-pod
    AllowedPattern: "^ledger-bench-[a-z0-9-]{1,40}$"
  Namespace:
    Type: String
    Default: ledger-bench
    AllowedValues: [ledger-bench]
  ServiceAccount:
    Type: String
    Default: ledger-bench
    AllowedValues: [ledger-bench]
  Owner:
    Type: String
    AllowedPattern: "^[a-z0-9-]{3,40}$"
  Ttl:
    Type: String
    AllowedPattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

Resources:
  PodRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref PodRoleName
      MaxSessionDuration: 3600
      # EKS Pod Identity tags the session with the cluster, namespace and ServiceAccount; only that
      # one ServiceAccount of that one cluster may take this role.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: pods.eks.amazonaws.com }
            Action: ["sts:AssumeRole", "sts:TagSession"]
            Condition:
              StringEquals:
                "aws:RequestTag/eks-cluster-arn": !Sub "arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}"
                "aws:RequestTag/eks-cluster-name": !Ref ClusterName
                "aws:RequestTag/kubernetes-namespace": !Ref Namespace
                "aws:RequestTag/kubernetes-service-account": !Ref ServiceAccount
      Policies:
        - PolicyName: assume-ledger-bench-client-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # TagSession because the Pod Identity session tags are transitive and travel with the hop.
              - Effect: Allow
                Action: ["sts:AssumeRole", "sts:TagSession"]
                Resource: !Sub "arn:${AWS::Partition}:iam::${DataAccountId}:role/ledger-bench-client"
      Tags:
        - { Key: purpose, Value: ledger-bench }
        - { Key: ttl, Value: !Ref Ttl }
        - { Key: owner, Value: !Ref Owner }

  Association:
    Type: AWS::EKS::PodIdentityAssociation
    Properties:
      ClusterName: !Ref ClusterName
      Namespace: !Ref Namespace
      ServiceAccount: !Ref ServiceAccount
      RoleArn: !GetAtt PodRole.Arn
      Tags:
        - { Key: purpose, Value: ledger-bench }
        - { Key: ttl, Value: !Ref Ttl }
        - { Key: owner, Value: !Ref Owner }

Outputs:
  PodRoleArn: { Value: !GetAtt PodRole.Arn }
