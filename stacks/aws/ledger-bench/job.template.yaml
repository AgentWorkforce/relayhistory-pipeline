# ledger-bench: the benchmark client on the cluster (docs/design/hosted-ledger-benchmark-plan.md).
# Rendered by ops.ts: the upper-case placeholders are filled from the operator's inputs, never committed. One Job per lane.
# The pod runs the ingest-edge image (same Bun, same node type) with the bundled harness from a ConfigMap,
# so no image is built or pushed for the benchmark.
apiVersion: batch/v1
kind: Job
metadata:
  name: ledger-bench-${RUN_ID}-${LANE}
  namespace: ledger-bench
  labels: { app.kubernetes.io/name: ledger-bench, ledger-bench/run: "${RUN_ID}", ledger-bench/lane: "${LANE}", purpose: ledger-bench }
spec:
  # The hard deadline: the Job is killed 4 hours after it starts. The finished Job (its log is the results)
  # is kept for 2 days, the stack's own ttl; teardown deletes the namespace before that.
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 172800
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels: { app.kubernetes.io/name: ledger-bench, ledger-bench/run: "${RUN_ID}", ledger-bench/lane: "${LANE}", purpose: ledger-bench }
    spec:
      restartPolicy: Never
      serviceAccountName: ledger-bench
      # EKS Pod Identity mounts its own token; the Kubernetes API token is not needed.
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector: ${NODE_SELECTOR_JSON}
      tolerations: ${TOLERATIONS_JSON}
      # Never on a node that runs the pods named in the inputs (the production ingest pods), so the client
      # cannot take CPU or network from them, nor they from it.
      affinity: ${AFFINITY_JSON}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bench
          image: ${IMAGE}
          command: ["bun", "/bench/main.js", "run"]
          env:
            - { name: LEDGER_BENCH_LANE, value: "${LANE}" }
            - { name: LEDGER_BENCH_RUN_ID, value: "${RUN_ID}" }
            - { name: LEDGER_BENCH_PROFILE, value: "${PROFILE}" }
            - { name: LEDGER_BENCH_STEPS, value: "${STEPS}" }
            - { name: LEDGER_BENCH_BUNDLE_SHA256, value: "${BUNDLE_SHA256}" }
            - name: LEDGER_BENCH_CONFIG
              valueFrom: { configMapKeyRef: { name: ledger-bench-config, key: config.json } }
            - { name: TMPDIR, value: /tmp }
          resources:
            requests: { cpu: "${CPU}", memory: "${MEMORY}" }
            # The CPU limit keeps the client from taking more than this from a node it shares with production pods.
            limits: { cpu: "${CPU_LIMIT}", memory: "${MEMORY}" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: bench, mountPath: /bench, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: bench
          configMap: { name: ledger-bench-bundle }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
