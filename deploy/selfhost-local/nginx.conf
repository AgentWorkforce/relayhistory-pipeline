# Edge for the local single-user stack (compose.yaml, docs/selfhost-local.md).
# Terminates TLS and routes per docs/selfhost-composition.md section 2: first
# match wins, no path rewriting, everything not listed is 404 here. Runs as the
# unprivileged nginx user, so every writable path is under /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Docker's embedded DNS: upstreams are re-resolved, so a restarted service is found again.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8443 ssl;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The ingest's MAX_DELIVERY_BYTES is 2 MiB on the wire; allow headroom, keep Content-Encoding.
    client_max_body_size 4m;

    # Upstreams as variables: proxy_pass with no URI part forwards the client's raw request URI.
    set $read_api http://session-read-api:8080;
    set $ingest http://session-ingest:8081;

    # nginx matches the normalized path but forwards the raw one. Refuse any raw path that the
    # services' URL parser could resolve differently: dot segments, encoded dots or slashes,
    # backslashes (a URL parser treats them as "/") and empty segments. In an nginx quoted string
    # "\\\\" is one escaped backslash in the regex.
    if ($request_uri ~ "^[^?]*(\\\\|%5[cC]|%2[eEfF]|//|/\.\.?(/|\?|$))") {
      return 404;
    }

    proxy_http_version 1.1;
    # Client-supplied trust headers are a tenant assertion: never forward them.
    proxy_set_header x-relay-ingest-identity "";
    proxy_set_header x-relay-ingest-signature "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;

    # 1
    location = /v1/cli/login { proxy_pass $read_api; }
    # 2 (wins over rule 4)
    location = /v1/delivery/records { proxy_pass $read_api; }
    # 3
    location = /v1/sessions { proxy_pass $read_api; }
    location ^~ /v1/sessions/ { proxy_pass $read_api; }
    location = /v1/events { proxy_pass $read_api; }
    location ^~ /v1/digest/ { proxy_pass $read_api; }
    # 4
    location ^~ /v1/delivery/ { proxy_pass $ingest; }
    location ^~ /v1/turns/ { proxy_pass $ingest; }
    # 5
    location ^~ /v1/onboarding/ { proxy_pass $ingest; }
    # 5a
    location = /v1/auth/token/refresh { proxy_pass $ingest; }
    # 6: probes, /internal/*, /v1/custody/* and everything else stay internal.
    location / { return 404; }
  }
}
