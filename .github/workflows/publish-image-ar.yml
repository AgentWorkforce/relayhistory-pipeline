# Publishes the 96bulls services image to the conformance Artifact Registry
# repository only. Manual dispatch. Khaliq must be the actor, the ref must be
# main, and the confirmation phrase must match. This file does not create
# Workload Identity, IAM, GitHub variables, or credentials, and it does not
# edit versions.lock.json or gcpProofEligible.
# The job fails closed until a separate approval sets:
#   vars.GCP_WORKLOAD_IDENTITY_PROVIDER
#   vars.GCP_AR_PUBLISHER_SERVICE_ACCOUNT
name: publish-image-ar
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish 96bulls-services to artifact registry" to confirm Khaliq approved this publish'
        required: true
      ref_note:
        description: 'Where the approval was given (date, call/message)'
        required: true
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor == 'khaliqgant' && github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'publish 96bulls-services to artifact registry' }}
    environment: image-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: agentrelay-96bulls-soc2-2610
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_AR_PUBLISHER_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: 'false'
          export_environment_variables: 'false'
          access_token_scopes: 'https://www.googleapis.com/auth/cloud-platform'
      - name: Configure in-memory registry auth
        run: |
          set -euo pipefail
          fstype=$(findmnt -n -o FSTYPE /dev/shm)
          if [ "$fstype" != tmpfs ]; then
            echo "refusing registry auth because /dev/shm is not tmpfs" >&2
            exit 1
          fi
          command -v jq >/dev/null
          auth_dir=$(mktemp -d /dev/shm/ar-docker.XXXXXX)
          chmod 700 "$auth_dir"
          cat > "$auth_dir/docker-credential-ar-env" <<'EOF'
          #!/bin/sh
          set -eu
          if [ "${1:-}" != get ]; then
            exit 0
          fi
          read -r server || true
          case "$server" in
            us-central1-docker.pkg.dev|https://us-central1-docker.pkg.dev|https://us-central1-docker.pkg.dev/|https://us-central1-docker.pkg.dev/v2/)
              ;;
            *)
              echo "refusing credential for unexpected registry" >&2
              exit 1
              ;;
          esac
          if [ -z "${AR_TOKEN:-}" ]; then
            echo "registry access token is absent" >&2
            exit 1
          fi
          jq -nc '{Username:"oauth2accesstoken", Secret:env.AR_TOKEN}'
          EOF
          chmod 700 "$auth_dir/docker-credential-ar-env"
          printf '%s\n' '{"credHelpers":{"us-central1-docker.pkg.dev":"ar-env"}}' > "$auth_dir/config.json"
          chmod 600 "$auth_dir/config.json"
          echo "$auth_dir" >> "$GITHUB_PATH"
          echo "DOCKER_CONFIG=$auth_dir" >> "$GITHUB_ENV"
          echo "AR_DOCKER_AUTH_DIR=$auth_dir" >> "$GITHUB_ENV"
      - name: Prove the auth directory stores no token
        env:
          AR_TOKEN: probe-token-not-a-credential
        run: |
          set -euo pipefail
          helper="$AR_DOCKER_AUTH_DIR/docker-credential-ar-env"
          out=$(printf '%s\n' 'us-central1-docker.pkg.dev' | "$helper" get)
          printf '%s' "$out" | jq -e '.Username == "oauth2accesstoken" and .Secret == "probe-token-not-a-credential"' >/dev/null
          if grep -R -F -q 'probe-token-not-a-credential' "$AR_DOCKER_AUTH_DIR"; then
            echo "probe token was written into the auth directory" >&2
            exit 1
          fi
          if printf '%s\n' 'ghcr.io' | "$helper" get >/dev/null 2>&1; then
            echo "helper returned a token for an unexpected registry" >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        env:
          AR_TOKEN: ${{ steps.auth.outputs.access_token }}
        with:
          context: .
          file: docker/services.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          # Immutable sha tag only. No :main and no :latest.
          tags: us-central1-docker.pkg.dev/agentrelay-96bulls-soc2-2610/awf-conformance-images/96bulls-services:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/AgentWorkforce/96BullSessions
            org.opencontainers.image.revision=${{ github.sha }}
            96bulls.approval=${{ github.event.inputs.ref_note }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/AgentWorkforce/96BullSessions
            index:org.opencontainers.image.revision=${{ github.sha }}
            manifest:org.opencontainers.image.source=https://github.com/AgentWorkforce/96BullSessions
            manifest:org.opencontainers.image.revision=${{ github.sha }}
      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "us-central1-docker.pkg.dev/agentrelay-96bulls-soc2-2610/awf-conformance-images/96bulls-services@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove in-memory registry auth
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${AR_DOCKER_AUTH_DIR:-}" ]; then
            if [ -f "$AR_DOCKER_AUTH_DIR/config.json" ] && jq -e '(.auths // {}) | length > 0' "$AR_DOCKER_AUTH_DIR/config.json" >/dev/null; then
              rm -rf -- "$AR_DOCKER_AUTH_DIR"
              echo "registry config stored an auth entry" >&2
              exit 1
            fi
            rm -rf -- "$AR_DOCKER_AUTH_DIR"
          fi
