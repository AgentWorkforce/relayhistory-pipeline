name: Image release safety
on:
  pull_request:
    paths:
      - ".github/workflows/publish-image.yml"
      - ".github/workflows/copy-amp-image.yml"
      - ".github/workflows/image-release-checks.yml"
      - "scripts/check-image-release.mjs"
      - "scripts/image-release-provenance.mjs"
      - "scripts/copy-reviewed-image.py"
      - "scripts/prepare-amp-image-copy.mjs"
      - "scripts/copy-amp-image.py"
      - "src/shared/__tests__/image*"
      - "docs/services-image-release.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-image.yml"
      - ".github/workflows/copy-amp-image.yml"
      - ".github/workflows/image-release-checks.yml"
      - "scripts/check-image-release.mjs"
      - "scripts/image-release-provenance.mjs"
      - "scripts/copy-reviewed-image.py"
      - "scripts/prepare-amp-image-copy.mjs"
      - "scripts/copy-amp-image.py"
      - "src/shared/__tests__/image*"
      - "docs/services-image-release.md"
permissions:
  contents: read
jobs:
  safety:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Check scripts and release trust boundaries; no signing or registry access
        run: |
          node --check scripts/check-image-release.mjs
          node --check scripts/image-release-provenance.mjs
          node --check scripts/prepare-amp-image-copy.mjs
          bun test ./src/shared/__tests__/image-release.test.ts ./src/shared/__tests__/image-provenance.test.ts ./src/shared/__tests__/image-copy.test.ts ./src/shared/__tests__/image-amp-copy.test.ts ./src/shared/__tests__/image-amp-memory-copy.test.ts
