name: deploy session-ingest
# Deploys the Cloudflare ingest Worker 96bulls-session-ingest (src/session-ingest/worker.ts) with
# the lockfile-pinned wrangler. Manual only, from main only, in the GitHub environment
# `session-ingest`. See runbooks/sessions-prod-session-ingest.md.
#
# Environment `session-ingest` (set up by the owner; this workflow creates and assumes nothing else):
#   required reviewer: Khaliq (every run, dry run included, waits for that approval)
#   environment secrets:
#     CLOUDFLARE_API_TOKEN    Workers Scripts:Edit (read + deploy of this one Worker)
#     CLOUDFLARE_ACCOUNT_ID   the Agent Workforce account id (never committed)
#
# What it deploys: main's code, with a configuration rendered from the live Worker. The plan step
# reads (GET only) the one version at 100%, its bindings and the Worker settings, and renders a
# wrangler config in runner temp that copies every variable, Hyperdrive/queue/Secrets Store/service
# binding, compatibility setting, limit, observability and logpush setting from live. Worker
# secrets stay where they are (wrangler keeps them on deploy). Queue consumers, queue settings
# and DLQs are not part of a Worker version and are not touched.
#
# Only these knobs may differ from live; precedence is explicit input > committed profile
# (deploy/session-ingest/production-profile.json) > live:
#   INGEST_ACCEPTANCE_MODE, INGEST_ASYNC_ADMISSION, INGEST_CLAIM_LOCK_BUSY, INGEST_CLAIM_TIMEOUT_BUSY
#   (profile-owned) and INGEST_SYNC_ADMISSION_FROZEN_RECEIPT (input only; empty = preserve live).
# Profile mode may fill a knob live leaves unset, refuses a live value that is set and differs, and
# never drops anything. Any change of a knob's effective value that was not asked for explicitly
# fails closed, in dry run too. With default inputs the render equals live and the job says so.
#
# dry_run (default true) stops after resolve + render + guard and prints the sanitized diff
# (knob names and on/off/drain/buffered/canonical values only). A real deploy re-reads live right
# before wrangler runs and refuses if the active version or the render changed, then verifies the
# new version carries exactly the render. Flipping any knob is Khaliq's own go.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Stop after resolve + render + guard and print the sanitized diff vs live (no deploy)
        type: boolean
        default: true
      ingest_async_admission:
        description: INGEST_ASYNC_ADMISSION. profile = committed profile (refuses a differing live value); off/drain/on = explicit (on only from drain)
        type: choice
        options: ["profile", "off", "drain", "on"]
        default: "profile"
      ingest_claim_lock_busy:
        description: INGEST_CLAIM_LOCK_BUSY. profile = committed profile; off/on = explicit
        type: choice
        options: ["profile", "off", "on"]
        default: "profile"
      ingest_claim_timeout_busy:
        description: INGEST_CLAIM_TIMEOUT_BUSY. profile = committed profile; off/on = explicit
        type: choice
        options: ["profile", "off", "on"]
        default: "profile"
      ingest_sync_admission_frozen_receipt:
        description: 'INGEST_SYNC_ADMISSION_FROZEN_RECEIPT. Empty = preserve live; exactly "off" or "on" = explicit (on needs buffered + frozen-supabase custody)'
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: session-ingest-production
  cancel-in-progress: false
jobs:
  refuse-non-main:
    if: github.ref != 'refs/heads/main'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - name: Refuse a dispatch from anything but main
        run: |
          echo "::error::deploy session-ingest runs only from refs/heads/main; refusing ${GITHUB_REF}"
          exit 1

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    environment: session-ingest
    env:
      # Inputs reach scripts only through env, never through expression interpolation in run.
      IN_DRY_RUN: ${{ inputs.dry_run }}
      IN_INGEST_ASYNC_ADMISSION: ${{ inputs.ingest_async_admission }}
      IN_INGEST_CLAIM_LOCK_BUSY: ${{ inputs.ingest_claim_lock_busy }}
      IN_INGEST_CLAIM_TIMEOUT_BUSY: ${{ inputs.ingest_claim_timeout_busy }}
      IN_INGEST_SYNC_ADMISSION_FROZEN_RECEIPT: ${{ inputs.ingest_sync_admission_frozen_receipt }}
      WRANGLER_SEND_METRICS: "false"
      # The lockfile-pinned wrangler (bun.lock: @96bulls/session-read-worker/wrangler).
      WRANGLER_VERSION: 4.156.1
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are given only to the steps that call
      # Cloudflare, never to install (dependency scripts), the tests or the input checks.
    steps:
      - name: Refuse anything but main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::refusing ${GITHUB_REF}, main only"; exit 1; }
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (root + workspaces)
        run: bun install --frozen-lockfile
      - name: Check the environment secrets exist (names only)
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'yes' || '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' && 'yes' || '' }}
        run: |
          test -n "$HAS_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not set on the session-ingest environment"; exit 1; }
          test -n "$HAS_ACCOUNT" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set on the session-ingest environment"; exit 1; }
      - name: Test the deploy planner (profile, precedence, guard, identifiers)
        run: |
          bun test --timeout 30000 ./stacks/cloudflare/__tests__/ingest-deploy-plan.test.ts
          bun test --timeout 30000 ./stacks/cloudflare/__tests__/ingest-deploy-identifiers.test.ts
      - name: Check the pinned wrangler
        run: |
          grep -q "\"@96bulls/session-read-worker/wrangler\": \[\"wrangler@${WRANGLER_VERSION}\"" bun.lock || { echo "::error::bun.lock no longer pins wrangler ${WRANGLER_VERSION}"; exit 1; }
          got="$(packages/session-read-worker/node_modules/.bin/wrangler --version | tail -1)"
          test "$got" = "$WRANGLER_VERSION" || { echo "::error::wrangler is ${got}, expected ${WRANGLER_VERSION}"; exit 1; }
      - name: Plan (read live, resolve, render, guard, sanitized diff; GET only)
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun stacks/cloudflare/ingest-deploy/cli.ts plan --out-dir "$RUNNER_TEMP/session-ingest-deploy"
      - name: Dry run result
        if: steps.plan.outputs.dry_run == 'true'
        env:
          DIFF_EMPTY: ${{ steps.plan.outputs.diff_empty }}
          LIVE_VERSION: ${{ steps.plan.outputs.live_version }}
        run: |
          if [ "$DIFF_EMPTY" = "true" ]; then
            echo "DRY RUN: the render equals live version ${LIVE_VERSION} (empty diff). Nothing was deployed."
          else
            echo "DRY RUN: the render differs from live version ${LIVE_VERSION} only by the explicit inputs listed above. Nothing was deployed."
          fi
          echo "### deploy session-ingest: dry run, nothing deployed (diff empty: ${DIFF_EMPTY})" >> "$GITHUB_STEP_SUMMARY"
      - name: Re-check live right before deploy (same active version, same render)
        if: steps.plan.outputs.dry_run == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_VERSION: ${{ steps.plan.outputs.live_version }}
          RENDER_SHA256: ${{ steps.plan.outputs.render_sha256 }}
        run: |
          bun stacks/cloudflare/ingest-deploy/cli.ts recheck --out-dir "$RUNNER_TEMP/session-ingest-deploy" \
            --expect-version "$LIVE_VERSION" --expect-sha "$RENDER_SHA256"
      - name: Deploy
        if: steps.plan.outputs.dry_run == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ${{ runner.temp }}/session-ingest-deploy
        run: |
          "$GITHUB_WORKSPACE/packages/session-read-worker/node_modules/.bin/wrangler" deploy \
            --config wrangler.json --message "96bulls-session-ingest ${GITHUB_SHA}"
      - name: Verify the new active version carries exactly the render
        if: steps.plan.outputs.dry_run == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_VERSION: ${{ steps.plan.outputs.live_version }}
        run: |
          bun stacks/cloudflare/ingest-deploy/cli.ts verify --out-dir "$RUNNER_TEMP/session-ingest-deploy" --previous "$LIVE_VERSION"
          echo "### deploy session-ingest: deployed; previous version (rollback handle) ${LIVE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
