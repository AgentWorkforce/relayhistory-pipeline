name: production DB read-only checks
run-name: db read-only checks (interval ${{ inputs.interval_seconds }}s, statement timeout ${{ inputs.statement_timeout_seconds }}s)

# Read-only production database checks: runbooks/sessions-prod-db-readonly-checks.md.
#
# Environment `production-db-readonly` (create it first: required reviewer Khaliq, deployment branches
# limited to main; the gate job refuses otherwise):
#   secret   DB_READONLY_URL       postgresql://<sessions_readonly_stats login>@<host>:<port>/<db>?sslmode=verify-full
#                                  (set by the owner from 1Password; never printed)
#   variable SUPABASE_PROJECT_REF  the production project ref (operator config, not in the repo)
#
# This workflow never writes. It connects as the stats-only role sessions_readonly_stats
# (scripts/sql/db-readonly-role.sql) with default_transaction_read_only=on, the chosen statement_timeout
# and lock_timeout=2s, refuses unless the session is read-only and the role holds no privilege at all on
# any sessions table, reads only statistics and catalog views (scripts/db-readonly-checks-queries.ts),
# and uploads one sanitized JSON artifact (counts, booleans, timestamps). Table-data sections are
# reported as not_permitted_pending_count_function.
on:
  workflow_dispatch:
    inputs:
      interval_seconds:
        description: Measurement window in seconds (60-1800)
        type: number
        default: 900
        required: true
      statement_timeout_seconds:
        description: Server statement_timeout in seconds (5-60); lock_timeout is fixed at 2s
        type: number
        default: 15
        required: true
      explain:
        description: Plan-only EXPLAIN shapes (never ANALYZE); skipped as not_permitted_pending_count_function until a count function exists
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: db-readonly-checks-production
  cancel-in-progress: false
jobs:
  # No environment here: a typo/missing environment must not auto-create an unprotected one.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse unless dispatched from main with valid inputs
        env:
          REF: ${{ github.ref }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
          STATEMENT_TIMEOUT_SECONDS: ${{ inputs.statement_timeout_seconds }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "refused: dispatch from refs/heads/main only"
            exit 1
          fi
          if ! [[ "$INTERVAL_SECONDS" =~ ^[0-9]{1,4}$ ]] || [ "$INTERVAL_SECONDS" -lt 60 ] || [ "$INTERVAL_SECONDS" -gt 1800 ]; then
            echo "refused: interval_seconds must be an integer 60-1800"
            exit 1
          fi
          if ! [[ "$STATEMENT_TIMEOUT_SECONDS" =~ ^[0-9]{1,2}$ ]] || [ "$STATEMENT_TIMEOUT_SECONDS" -lt 5 ] || [ "$STATEMENT_TIMEOUT_SECONDS" -gt 60 ]; then
            echo "refused: statement_timeout_seconds must be an integer 5-60"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify the environment is protected before requesting it
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/db-readonly-environment-gate.ts production-db-readonly
  checks:
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-db-readonly
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Run the fixed read-only query set
        env:
          DB_READONLY_URL: ${{ secrets.DB_READONLY_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds }}
          STATEMENT_TIMEOUT_SECONDS: ${{ inputs.statement_timeout_seconds }}
          EXPLAIN: ${{ inputs.explain }}
          OUTPUT: db-readonly-checks.json
        run: bun scripts/db-readonly-checks.ts
      - name: Upload sanitized artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-readonly-checks-${{ github.run_id }}
          path: db-readonly-checks.json
          if-no-files-found: warn
          retention-days: 30
