name: search-benchmark
# Synthetic data on a disposable local Postgres. No secrets, no hosted service.
on:
  pull_request:
    paths:
      - benchmarks/session-search/**
      - supabase/migrations/**
      - src/hoopdb/search-index-contract.ts
      - .github/workflows/search-benchmark.yml
  workflow_dispatch:
    inputs:
      scale:
        description: S, M or L
        default: S
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scale: ${{ fromJSON(inputs.scale && format('["{0}"]', inputs.scale) || '["S", "M"]') }}
    services:
      postgres:
        # Supabase's current major.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: benchmark-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Harness checks (PGlite)
        run: bun test ./benchmarks
      - name: Benchmark (fails on isolation, correctness, an empty plan or the agent gate)
        env:
          BENCH_PG_URL: postgres://postgres:benchmark-only@127.0.0.1:5432/postgres
          BENCH_SCALE: ${{ matrix.scale }}
          BENCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BENCH_OUT: benchmark-report.json
        run: bun benchmarks/session-search/run.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-benchmark-report-${{ matrix.scale }}
          path: benchmark-report.json
          if-no-files-found: ignore

  clickhouse-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scale: [S, M]
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.34.13
        env:
          CLICKHOUSE_PASSWORD: benchmark-only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --password benchmark-only -q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: ClickHouse gates (fails on gate 3 or 4)
        env:
          BENCH_CH_URL: http://127.0.0.1:8123
          BENCH_CH_PASSWORD: benchmark-only
          BENCH_CH_SHELL: docker exec ${{ job.services.clickhouse.id }} sh -c
          BENCH_SCALE: ${{ matrix.scale }}
          BENCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BENCH_OUT: clickhouse-report.json
        run: bun benchmarks/session-search/clickhouse-gates.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clickhouse-gates-report-${{ matrix.scale }}
          path: clickhouse-report.json
          if-no-files-found: ignore
  e2e-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scale: ["S", "M"]
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.34.13
        env:
          CLICKHOUSE_PASSWORD: benchmark-only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --password benchmark-only -q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test ./benchmarks/session-search/e2e
      - name: Run proof
        env:
          BENCH_CH_URL: http://127.0.0.1:8123
          BENCH_CH_USER: default
          BENCH_CH_PASSWORD: benchmark-only
          BENCH_SCALE: ${{ matrix.scale }}
          BENCH_SHAPE_FILE: ${{ matrix.scale == 'M' && 'benchmarks/session-search/e2e/shape-2026-10-31.json' || '' }}
          BENCH_OUT: e2e-report.json
        run: bun benchmarks/session-search/e2e/proof.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-proof-report-${{ matrix.scale }}
          path: e2e-report.json
