name: backlog ops
run-name: ${{ github.event_name == 'workflow_dispatch' && format('backlog ops {0} {1}', inputs.mode, inputs.sha) || format('backlog ops proof {0}', github.sha) }}

# Guarded runs of the 0005 backlog tools against production: the fence backfill, the accepted-stage export and the S3
# drain (docs/decisions/0005-s3-native-upload-ledger.md "The buffered backlog"; docs/backlog-ops-workflow.md; contract
# in src/session-ingest/backlog-ops.ts). Dry modes are always allowed. Every execute is dormant until a reviewed
# commit flips BACKLOG_OPS_EXECUTE_ENABLED, and is bound by a typed confirmation to earlier successful runs of this
# workflow at the same commit (its dry run; the backfill; for the drain, a fresh backfill and the export after it),
# whose receipts are checked before any credential is read. The workflow never passes --checkpoint-file or
# --start-after: a rerun is safe because the drain skips objects it already marked. backfill-refresh-dry/-execute run
# the backfill's fences and ownership sections only; a drain may bind a fresh refresh beside the full backfill-execute
# it refreshes (full_backfill_run) when the two receipts' input fingerprints are equal. backfill-catchup-dry/-execute
# (the two-phase cutover's phase B) bind a full backfill-execute (full_backfill_run) and run all three sections, the
# revisions only since t = that run's created_at minus a fixed margin, computed by the gate from the GitHub API (the
# recheck step's output revisions_since_ms, never an input); a drain may bind a fresh catch-up beside its FULL as it
# binds a refresh. The optional org scope is the
# environment SECRET BACKLOG_OPS_ORGS (a secret, not a variable, so this public repository's logs mask it): unset or
# empty runs every org; an execute refuses unless its bound runs carry the same scope (src/session-ingest/backlog-ops.ts).
# Path B (default off) is the SECRET BACKLOG_OPS_NO_HEAD_PARITY_ORGS and the variable BACKLOG_OPS_NO_HEAD_PARITY_MAX_AGE_SECONDS,
# passed to the tool step for export and drain modes only; the receipt records only their hash.
# presence-dry is DRY ONLY (no presence-execute exists or is accepted): a counts-only look at ONE session for support
# diagnosis, in the dry environment with the dry AWS role; its DB login is the migration owner, read-only only by
# default_transaction_read_only=on and a READ ONLY transaction. Its session id is the dry environment's SECRET
# SESSION_PRESENCE_SESSION, set by the owner before the dispatch and removed after it, passed only to the tool step
# and only for this mode; it never reaches argv, a log line or the receipt (docs/backlog-ops-workflow.md).
# reshard-dry (DRY ONLY, scoped runs only) verifies the revision reshard per org against the revision home (the ledger
# bucket when BACKLOG_OPS_LEDGER_* is set). authority-dry (scoped) reads the unbound live evidence for the per-org
# fence-authority marker (Cloudflare read-only token: the SECRET BACKLOG_OPS_CLOUDFLARE_TOKEN, authority modes only);
# a catch-up may bind it (authority_run) to record authorityBaseline in its input snapshot. authority-execute binds
# its dry, that catch-up, its FULL and a reshard-dry, and writes the markers create-only; it is HELD in code
# (BACKLOG_OPS_AUTHORITY_EXECUTE_ENABLED) until its evidence passes review (docs/backlog-ops-workflow.md "Authority").
# bridge-dry (scoped, binds full_backfill_run) reads each org's erasure-window proof for the admission hold's release
# (src/session-ingest/erasure-window.ts); bridge-execute is HELD in code (BACKLOG_OPS_BRIDGE_EXECUTE_ENABLED).
# marker-dry (scoped; binds authority_run, backfill_run = the catch-up, full_backfill_run and reshard_run) reads, per org,
# the 062320 admission hold, the marker's attestations, the sweeper and the bound evidence, and records the wave id over
# the ready orgs' hold epochs; marker-execute binds that dry, the same runs and its wave_id (confirmation WAVE <id>) and
# publishes each wave org's marker under its enforced hold (src/session-ingest/marker-publication.ts). It is HELD in
# code (BACKLOG_OPS_MARKER_EXECUTE_ENABLED). Org ids reach no input, run-name, log line or receipt: wave_id is a hash.
# Push and pull_request run only the credential-free tests (no secrets, no environment).
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [backfill-dry, backfill-execute, export-dry, export-execute, drain-dry, drain-execute, presence-dry, backfill-refresh-dry, backfill-refresh-execute, backfill-catchup-dry, backfill-catchup-execute, reshard-dry, authority-dry, authority-execute, bridge-dry, bridge-execute, marker-dry, marker-execute]
        default: backfill-dry
        required: true
      sha:
        description: Exact current main commit (40 lowercase hex)
        type: string
        required: true
      dry_run:
        description: Execute only - the same tool's successful dry run of this workflow at the same sha; empty otherwise
        type: string
        default: ""
      backfill_run:
        description: export-execute and drain-execute - a successful backfill-execute run at the same sha (the drain's under 3h old); authority-execute - the backfill-catchup-execute (under 3h old) that recorded the baseline; reshard-dry (optional) - the completed catch-up execute it verifies after; empty otherwise
        type: string
        default: ""
      export_run:
        description: drain-execute only - a successful export-execute run at the same sha, after the backfill; empty otherwise
        type: string
        default: ""
      full_backfill_run:
        description: backfill-catchup-dry/-execute and authority-execute (required) - the full backfill-execute (under 24h old) the catch-up follows; drain-execute (optional) - the one backfill_run, then a refresh or catch-up execute, follows; empty otherwise
        type: string
        default: ""
      reshard_run:
        description: authority-execute only (required) - a successful reshard-dry at the same sha whose verify passed for every org; empty otherwise
        type: string
        default: ""
      authority_run:
        description: backfill-catchup-dry/-execute only (optional) - a successful authority-dry at the same sha; the catch-up then records the authority baseline; empty otherwise
        type: string
        default: ""
      wave_id:
        description: marker-execute only (required) - the wave id its marker-dry recorded (h_ and 32 hex; a hash, never an org); empty otherwise
        type: string
        default: ""
      max_objects:
        description: Drain modes only - per-run object budget (empty = unbounded)
        type: string
        default: ""
      slots_read:
        description: 'Backfill modes only - "org" reads a scoped run''s owned slots once per org through the org index; empty or "heap" (default) keeps the heap block windows'
        type: string
        default: ""
      slot_pace_ms:
        description: 'Backfill modes with slots_read=org only - milliseconds paused between the org slot cursor''s fetches (0-5000, digits); empty (default) or 0 = unpaced'
        type: string
        default: ""
      confirmation:
        description: 'Execute: <MODE uppercase> <sha> DRY <dry_run> [BACKFILL <backfill_run>] [FULL <full_backfill_run>] [EXPORT <export_run>] [RESHARD <reshard_run>] [AUTHORITY <authority_run>] (catch-up: BACKFILL-CATCHUP-EXECUTE <sha> DRY <dry_run> FULL <full_backfill_run> [AUTHORITY <authority_run>]; AUTHORITY-EXECUTE <sha> DRY <dry_run> BACKFILL <backfill_run> FULL <full_backfill_run> RESHARD <reshard_run>; MARKER-EXECUTE <sha> DRY <dry_run> BACKFILL <backfill_run> FULL <full_backfill_run> RESHARD <reshard_run> AUTHORITY <authority_run> WAVE <wave_id>). Dry modes: empty'
        type: string
        default: ""
  pull_request:
    paths:
      - .github/workflows/backlog-ops.yml
      - scripts/backlog-authority.ts
      - src/session-ingest/backlog-authority.ts
      - src/session-ingest/__tests__/backlog-authority*
      - src/session-ingest/authority-evidence.ts
      - src/session-ingest/rearm-sweeper-receipt.ts
      - src/session-ingest/revision-reshard.ts
      - src/session-ingest/erasure-window.ts
      - src/session-ingest/hold-bridge.ts
      - src/session-ingest/__tests__/erasure-window*
      - src/session-ingest/__tests__/hold-bridge*
      - scripts/backlog-marker.ts
      - scripts/backlog-reshard-verify.ts
      - src/session-ingest/marker-publication.ts
      - src/session-ingest/org-wave.ts
      - src/session-ingest/reshard-wave.ts
      - src/session-ingest/__tests__/marker-publication*
      - src/session-ingest/__tests__/org-wave*
      - scripts/backlog-ops*.ts
      - src/session-ingest/backlog-ops.ts
      - src/session-ingest/__tests__/backlog-ops*
      - scripts/session-presence.ts
      - src/session-ingest/session-presence.ts
      - src/session-ingest/__tests__/session-presence*
      - scripts/upload-fence-backfill.ts
      - scripts/buffered-drain.ts
      - src/session-ingest/ledger-tool-store.ts
      - src/session-ingest/__tests__/ledger-tool-store*
      - src/session-ingest/ledger-store.ts
      - src/session-ingest/buffered-drain.ts
      - src/session-ingest/upload-fence-backfill.ts
      - src/session-ingest/__tests__/buffered-drain.test.ts
      - src/session-ingest/__tests__/upload-fence-backfill.pglite.test.ts
  push:
    branches: [main]
    paths:
      - .github/workflows/backlog-ops.yml
      - scripts/backlog-authority.ts
      - src/session-ingest/backlog-authority.ts
      - src/session-ingest/__tests__/backlog-authority*
      - src/session-ingest/authority-evidence.ts
      - src/session-ingest/rearm-sweeper-receipt.ts
      - src/session-ingest/revision-reshard.ts
      - src/session-ingest/erasure-window.ts
      - src/session-ingest/hold-bridge.ts
      - src/session-ingest/__tests__/erasure-window*
      - src/session-ingest/__tests__/hold-bridge*
      - scripts/backlog-marker.ts
      - scripts/backlog-reshard-verify.ts
      - src/session-ingest/marker-publication.ts
      - src/session-ingest/org-wave.ts
      - src/session-ingest/reshard-wave.ts
      - src/session-ingest/__tests__/marker-publication*
      - src/session-ingest/__tests__/org-wave*
      - scripts/backlog-ops*.ts
      - src/session-ingest/backlog-ops.ts
      - src/session-ingest/__tests__/backlog-ops*
      - scripts/session-presence.ts
      - src/session-ingest/session-presence.ts
      - src/session-ingest/__tests__/session-presence*
      - scripts/upload-fence-backfill.ts
      - scripts/buffered-drain.ts
      - src/session-ingest/ledger-tool-store.ts
      - src/session-ingest/__tests__/ledger-tool-store*
      - src/session-ingest/ledger-store.ts
      - src/session-ingest/buffered-drain.ts
      - src/session-ingest/upload-fence-backfill.ts
      - src/session-ingest/__tests__/buffered-drain.test.ts
      - src/session-ingest/__tests__/upload-fence-backfill.pglite.test.ts

permissions:
  contents: read
  actions: read
  deployments: read

# Dispatches serialise with every guarded production operator (apply-session-schema, ingest-generation-overlap,
# index-prebuild-058000, owner-buffered-parity, ingest-admission-renewal): a backfill or export never reads the owner
# database mid-apply or mid-rebind, and only one backlog operation runs at a time (the tools also hold S3 leases).
# Proof runs get their own per-sha group so a push never queues behind (or cancels) a pending dispatch.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'guarded-session-schema-production' || format('backlog-ops-proof-{0}', github.sha) }}
  cancel-in-progress: false

env:
  BACKLOG_OPS_MODE: ${{ inputs.mode }}
  BACKLOG_OPS_SHA: ${{ inputs.sha }}
  BACKLOG_OPS_DRY_RUN: ${{ inputs.dry_run }}
  BACKLOG_OPS_BACKFILL_RUN: ${{ inputs.backfill_run }}
  BACKLOG_OPS_EXPORT_RUN: ${{ inputs.export_run }}
  BACKLOG_OPS_FULL_BACKFILL_RUN: ${{ inputs.full_backfill_run }}
  BACKLOG_OPS_RESHARD_RUN: ${{ inputs.reshard_run }}
  BACKLOG_OPS_AUTHORITY_RUN: ${{ inputs.authority_run }}
  BACKLOG_OPS_WAVE_ID: ${{ inputs.wave_id }}
  BACKLOG_OPS_MAX_OBJECTS: ${{ inputs.max_objects }}
  BACKLOG_OPS_SLOTS_READ: ${{ inputs.slots_read }}
  BACKLOG_OPS_SLOT_PACE_MS: ${{ inputs.slot_pace_ms }}
  BACKLOG_OPS_CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  proof:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install without credentials
        run: bun install --frozen-lockfile
      - name: Contract, gate and workflow tests (no credentials)
        run: bun test --timeout 120000 ./src/session-ingest/__tests__/backlog-ops.test.ts
      - name: Authority modes, reshard verify and marker tests (in-process fake stores and providers, no credentials)
        run: |
          bun test --timeout 120000 ./src/session-ingest/__tests__/backlog-authority.test.ts
          bun test --timeout 300000 ./src/session-ingest/__tests__/hold-bridge.test.ts ./src/session-ingest/__tests__/erasure-window.test.ts
      - name: Marker publication under the 062320 hold and org waves (in-process fakes and PGlite, no credentials)
        run: |
          bun test --timeout 120000 ./src/session-ingest/__tests__/org-wave.test.ts ./src/session-ingest/__tests__/marker-publication.test.ts
          bun test --timeout 300000 ./src/session-ingest/__tests__/marker-publication.pglite.test.ts
      - name: Relocated-ledger stores and fork guard of the backfill and the drain (in-process fake buckets, no credentials)
        run: bun test --timeout 120000 ./src/session-ingest/__tests__/ledger-tool-store.test.ts
      - name: The drain and the backfill end to end, routed and single-bucket (scratch stores, in-process PGlite, no credentials)
        run: |
          bun test --timeout 300000 ./src/session-ingest/__tests__/buffered-drain.test.ts
          bun test --timeout 300000 ./src/session-ingest/__tests__/upload-fence-backfill.pglite.test.ts
      - name: Session presence counts and no-id-leak tests (in-process PGlite, no credentials)
        run: |
          bun test --timeout 300000 ./src/session-ingest/__tests__/session-presence.test.ts
          bun test --timeout 300000 ./src/session-ingest/__tests__/session-presence.pglite.test.ts

  # No environment here: a typo/missing environment must not auto-create an unprotected one.
  prerequisite-gate:
    if: github.event_name == 'workflow_dispatch' && github.repository_id == '1437714333' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install without credentials
        run: bun install --frozen-lockfile
      - name: Verify dormant switch, mode, bindings, exact main, dispatch identity and green CI
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Writes environment=<the mode's protected environment> to GITHUB_OUTPUT: session-schema-production for a
        # dry run, session-backlog-execute for an execute (src/session-ingest/backlog-ops.ts backlogOpsEnvironment).
        run: bun scripts/backlog-ops-github.ts

  operate:
    needs: prerequisite-gate
    runs-on: ubuntu-latest
    # Below the 6 h role session (and the 6 h hosted-runner cap): the job ends before its credentials expire, and the
    # run refuses before the tool starts unless the session has at least 5 h left (checkStsExpiration).
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    environment:
      name: ${{ needs.prerequisite-gate.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install without credentials
        run: bun install --frozen-lockfile
      - name: Recheck live gates and the recorded environment approval
        id: recheck
        # Also writes revisions_since_ms (FULL's created_at minus the catch-up margin) whenever full_backfill_run is bound.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/backlog-ops-github.ts --approved
      - name: Download the bound dry run's receipt (execute only)
        if: endsWith(inputs.mode, '-execute')
        uses: actions/download-artifact@v4
        with:
          name: backlog-ops-receipt
          path: ${{ runner.temp }}/backlog-ops-bound/dry
          repository: ${{ github.repository }}
          run-id: ${{ inputs.dry_run }}
          github-token: ${{ github.token }}
      - name: Download the bound backfill's receipt (export-execute, drain-execute, authority-execute, marker-*; reshard-dry with backfill_run)
        if: inputs.mode == 'export-execute' || inputs.mode == 'drain-execute' || inputs.mode == 'authority-execute' || startsWith(inputs.mode, 'marker-') || (inputs.mode == 'reshard-dry' && inputs.backfill_run != '')
        uses: actions/download-artifact@v4
        with:
          name: backlog-ops-receipt
          path: ${{ runner.temp }}/backlog-ops-bound/backfill
          repository: ${{ github.repository }}
          run-id: ${{ inputs.backfill_run }}
          github-token: ${{ github.token }}
      - name: Download the bound full backfill's receipt (drain-execute with full_backfill_run, backfill-catchup-*, authority-execute, bridge-*, marker-*)
        if: (inputs.mode == 'drain-execute' || startsWith(inputs.mode, 'backfill-catchup-') || inputs.mode == 'authority-execute' || startsWith(inputs.mode, 'bridge-') || startsWith(inputs.mode, 'marker-')) && inputs.full_backfill_run != ''
        uses: actions/download-artifact@v4
        with:
          name: backlog-ops-receipt
          path: ${{ runner.temp }}/backlog-ops-bound/full
          repository: ${{ github.repository }}
          run-id: ${{ inputs.full_backfill_run }}
          github-token: ${{ github.token }}
      - name: Download the bound export's receipt (drain-execute)
        if: inputs.mode == 'drain-execute'
        uses: actions/download-artifact@v4
        with:
          name: backlog-ops-receipt
          path: ${{ runner.temp }}/backlog-ops-bound/export
          repository: ${{ github.repository }}
          run-id: ${{ inputs.export_run }}
          github-token: ${{ github.token }}
      - name: Download the bound reshard verify's receipt (authority-execute, marker-*)
        if: inputs.mode == 'authority-execute' || startsWith(inputs.mode, 'marker-')
        uses: actions/download-artifact@v4
        with:
          name: backlog-ops-receipt
          path: ${{ runner.temp }}/backlog-ops-bound/reshard
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reshard_run }}
          github-token: ${{ github.token }}
      - name: Download the bound authority evidence's receipt (backfill-catchup-* with authority_run, marker-*)
        if: (startsWith(inputs.mode, 'backfill-catchup-') || startsWith(inputs.mode, 'marker-')) && inputs.authority_run != ''
        uses: actions/download-artifact@v4
        with:
          name: backlog-ops-receipt
          path: ${{ runner.temp }}/backlog-ops-bound/authority
          repository: ${{ github.repository }}
          run-id: ${{ inputs.authority_run }}
          github-token: ${{ github.token }}
      # The only step given the owner URL secret, and the only step that requests the OIDC token and exchanges it for
      # the mode's role. GitHub exposes ACTIONS_ID_TOKEN_REQUEST_* to every step of a job with id-token: write, so the
      # job's other steps (checkout, setup-bun, install, gate, download-artifact) could request a token too. That is
      # why only this job has id-token: write, the write role trusts only the execute environment's subject, and
      # every action is first-party. Bucket, region, key and role ARNs are the environment's protected variables. The
      # URL reaches the tool only over its stdin pipe; the role session only in the tool's environment. The presence
      # session id is given to this step only, for presence-dry only, and reaches the tool on the same stdin pipe.
      - name: Run the backlog tool (the only step holding the DB secret or the role session)
        env:
          SUPABASE_MIGRATION_OWNER_URL: ${{ (startsWith(inputs.mode, 'backfill-') || startsWith(inputs.mode, 'export-') || inputs.mode == 'presence-dry' || startsWith(inputs.mode, 'authority-') || startsWith(inputs.mode, 'bridge-') || startsWith(inputs.mode, 'marker-')) && secrets.SUPABASE_MIGRATION_OWNER_URL || '' }}
          # The authority modes' read-only Cloudflare token (Workers Scripts:Read, Queues:Read): a SECRET on both
          # environments, given to this step for authority and marker modes only; the tool gets it only on its stdin pipe.
          BACKLOG_OPS_CLOUDFLARE_TOKEN: ${{ (startsWith(inputs.mode, 'authority-') || startsWith(inputs.mode, 'marker-')) && secrets.BACKLOG_OPS_CLOUDFLARE_TOKEN || '' }}
          SESSION_PRESENCE_SESSION: ${{ inputs.mode == 'presence-dry' && secrets.SESSION_PRESENCE_SESSION || '' }}
          BACKLOG_OPS_BUCKET: ${{ vars.BACKLOG_OPS_BUCKET }}
          BACKLOG_OPS_REGION: ${{ vars.BACKLOG_OPS_REGION }}
          BACKLOG_OPS_KMS_KEY_ARN: ${{ vars.BACKLOG_OPS_KMS_KEY_ARN }}
          BACKLOG_OPS_DRY_ROLE_ARN: ${{ vars.BACKLOG_OPS_DRY_ROLE_ARN }}
          BACKLOG_OPS_EXECUTE_ROLE_ARN: ${{ vars.BACKLOG_OPS_EXECUTE_ROLE_ARN }}
          # The relocated upload ledger (docs/ledger-relocation.md): both or neither. Set, the backfill and the drain
          # write ledger/** there (INGEST_LEDGER_BUCKET / _REGION in the tool's environment); unset, the ledger is in
          # BACKLOG_OPS_BUCKET. Set them on BOTH protected environments, never at repository or organisation scope:
          # `vars` falls back to those scopes, which this step cannot tell apart (docs/backlog-ops-workflow.md).
          # INGEST_LEDGER_HOME_GUARD is not set here on purpose: the credential step builds the tool's environment
          # from an allowlist and adds INGEST_LEDGER_HOME_GUARD=on itself (backlogOpsLedgerEnv), so a value here would
          # never reach the tool.
          BACKLOG_OPS_LEDGER_BUCKET: ${{ vars.BACKLOG_OPS_LEDGER_BUCKET }}
          BACKLOG_OPS_LEDGER_REGION: ${{ vars.BACKLOG_OPS_LEDGER_REGION }}
          BACKLOG_OPS_ORGS: ${{ secrets.BACKLOG_OPS_ORGS }}
          # Path B (src/session-ingest/backlog-ops.ts; default off): the export's no-head-parity allow-list (a SECRET,
          # same format as BACKLOG_OPS_ORGS and inside it; set identically on both environments or neither) and the parity
          # row's maximum age in seconds (a variable, 60-21600). Never dispatch inputs (run inputs are public). Export
          # modes use them; drain modes only check the bound export recorded the same; every other mode gets them empty.
          BACKLOG_OPS_NO_HEAD_PARITY_ORGS: ${{ (startsWith(inputs.mode, 'export-') || startsWith(inputs.mode, 'drain-')) && secrets.BACKLOG_OPS_NO_HEAD_PARITY_ORGS || '' }}
          BACKLOG_OPS_NO_HEAD_PARITY_MAX_AGE_SECONDS: ${{ (startsWith(inputs.mode, 'export-') || startsWith(inputs.mode, 'drain-')) && vars.BACKLOG_OPS_NO_HEAD_PARITY_MAX_AGE_SECONDS || '' }}
          BACKLOG_OPS_REVISIONS_SINCE_MS: ${{ steps.recheck.outputs.revisions_since_ms }}
        run: bun scripts/backlog-ops.ts
      - name: Publish the counts-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backlog-ops-receipt
          path: ${{ runner.temp }}/backlog-ops-out/backlog-ops-receipt.json
          if-no-files-found: ignore
          retention-days: 30
