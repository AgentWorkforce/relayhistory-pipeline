name: deploy session-read-worker
# Deploys the session read Worker (packages/session-read-worker) to the Agent
# Workforce Cloudflare account. Manual only, from main, in the
# `session-read-worker` environment (give it required reviewers); see
# runbooks/sessions-prod-session-read-worker.md.
#
# Environment variables (not secrets; the deploy refuses to run without them):
#   SESSION_READ_HYPERDRIVE_ID   the Hyperdrive config for bulls96_read_api (32 hex)
#   SESSION_READ_SUPABASE_CA_ID   the uploaded Supabase Root 2021 CA certificate id
#   SESSION_READ_ORIGIN          https://sessions-read.agentrelay.com (also Cloud's SESSIONS_READ_96BULLS_URL)
#   SESSION_READ_COMPLETE_SINCE  ISO UTC timestamp ClickHouse is complete from, or "epoch"
#   SESSION_READ_TIMING_ASSUME_NO_TURNS  optional "true" (runbook, "Session timing")
# Environment secret: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, Hyperdrive:Read).
#
# Owner-buffered reads (Option C, src/session-read-api/owner-buffered.ts), default off.
# A dispatch without inputs (or owner_buffered=off) renders exactly the config deployed
# before these inputs existed: no service binding, no flag. owner_buffered=on renders
# (scripts/render-deploy-config.ts) the HISTORY_CONTROL_HEAD service binding to
# relayhistory-api's named entrypoint SessionReadPrivacyControls (pinned in the script),
# RELAYHISTORY_READ_OWNER_BUFFERED=true, READ_API_OWNER_BUFFERED_WORKSPACES from the
# owner_buffered_workspaces input (explicit ids, each also on
# SESSION_READ_DIRECTORY_WORKSPACES; or exactly "*", the all-workspaces mode, accepted only
# when SESSION_READ_DIRECTORY_WORKSPACES is itself exactly "*"; "*" mixed with ids is
# refused; the per-user privacy gate is unchanged in either case), and, from environment
# variables required only then:
#   SESSION_READ_INGEST_S3_BUCKET  the ingest bucket holding buffered-batches/ (INGEST_S3_BUCKET)
#   SESSION_READ_INGEST_S3_REGION  its region (INGEST_S3_REGION)
# The S3 credentials are the Worker's PIPELINE_RAW_S3_ACCESS_KEY_ID / _SECRET_ACCESS_KEY
# secrets (wrangler secret put; GetObject + kms:Decrypt on buffered-batches/ is a separate
# IAM grant); an on deploy refuses to run unless both exist. Every later dispatch without
# inputs turns the feature off again.
#
# owner_buffered_events=on (valid only with owner_buffered=on; the render refuses it otherwise)
# adds READ_API_OWNER_BUFFERED_EVENTS=on: owner-buffered session events on
# GET /v1/sessions/:sessionId/events with `source`. off (or no input) renders exactly the
# owner_buffered render without it. Turning it on is a production change: dispatch is Khaliq's
# call. Every later dispatch without the input turns it off again.
#
# owner_buffered_stage_concurrency=2..32 and owner_buffered_phase_log=on (valid only with
# owner_buffered_events=on; the render refuses them otherwise) add
# READ_API_OWNER_BUFFERED_STAGE_CONCURRENCY=<n> (at most n S3 stage GetObjects in flight per
# owner-buffered events read; the authority checks keep their order) and
# READ_API_OWNER_BUFFERED_PHASE_LOG=1 (per-phase *_ms fields on the request log line). off (or no
# input) renders exactly the render without them. Dispatch is Khaliq's call; every later dispatch
# without the inputs turns them off again.
#
# Buffered search gate (src/session-read-api/buffered-search-gate.ts, PR #338), default off.
# buffered_search_gate=off (or no input) changes nothing: the render is byte-identical to the one
# before this input existed. buffered_search_gate=on renders READ_API_BUFFERED_SEARCH_GATE=on and
# the same pinned HISTORY_CONTROL_HEAD binding (once, also when owner_buffered=on); it needs no
# workspace list and no S3, and refuses any other value. The gate drops every buffered-origin
# search hit it cannot prove visible, so it must be deployed BEFORE the buffered search feeder
# (#339) is enabled. Turning it on is a production change: dispatch is Khaliq's call. Every later
# dispatch without the input turns the gate off again.
#
# Agent-name prefix search (docs/agent-name-search-contract.md), default off. agent_match=off (or no
# input) changes nothing: the render is byte-identical to the one before this input existed.
# agent_match=on adds READ_API_AGENT_MATCH=true to whichever render the other inputs select. Turn it
# on only after migration 20261105050020 is applied to the read database (before that a prefix
# request is 501 agent_match_not_migrated). Turning it on is a production change: dispatch is
# Khaliq's call. Every later dispatch without the input turns it off again.
#
# The Worker's own secrets (CLICKHOUSE_URL, CLICKHOUSE_USER, CLICKHOUSE_PASSWORD)
# are never handled here: they are set with `wrangler secret put` from 1Password
# and survive deploys. This workflow checks that they exist, by name only.
on:
  workflow_dispatch:
    inputs:
      owner_buffered:
        description: Owner-buffered reads (Option C). off = exactly the default deploy
        type: choice
        options: ["off", "on"]
        default: "off"
      owner_buffered_workspaces:
        description: 'Canary workspace ids, comma-separated, or exactly "*" for all workspaces (only if SESSION_READ_DIRECTORY_WORKSPACES is "*"); required when on'
        type: string
        default: ""
      owner_buffered_events:
        description: Owner-buffered session events (GET /v1/sessions/:id/events with source); valid only with owner_buffered=on. off = exactly the owner_buffered render
        type: choice
        options: ["off", "on"]
        default: "off"
      owner_buffered_stage_concurrency:
        description: 'Owner-buffered events: S3 stage GetObjects in flight, "off" or an integer 2..32; valid only with owner_buffered_events=on. off = the serial fetch'
        type: string
        default: "off"
      owner_buffered_phase_log:
        description: Owner-buffered events per-phase log fields; valid only with owner_buffered_events=on. off = exactly the render without them
        type: choice
        options: ["off", "on"]
        default: "off"
      buffered_search_gate:
        description: Per-hit privacy gate for buffered search hits (#338); needs no other input. off = exactly the default deploy
        type: choice
        options: ["off", "on"]
        default: "off"
      agent_match:
        description: Agent-name prefix search (READ_API_AGENT_MATCH=true); needs migration 20261105050020 applied. off = exactly the render without it
        type: choice
        options: ["off", "on"]
        default: "off"
permissions:
  contents: read
concurrency:
  group: session-read-worker-production
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/session-read-worker-checks.yml
    with:
      ref: ${{ github.sha }}

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment: session-read-worker
    env:
      CLOUDFLARE_ACCOUNT_ID: f7232cb80f6fab86a95426302af243e4
      # CLOUDFLARE_API_TOKEN is given only to the steps that call Cloudflare,
      # never to install (dependency scripts) or the input checks.
      HYPERDRIVE_ID: ${{ vars.SESSION_READ_HYPERDRIVE_ID }}
      EXPECTED_CA_ID: ${{ vars.SESSION_READ_SUPABASE_CA_ID }}
      ORIGIN: ${{ vars.SESSION_READ_ORIGIN }}
      COMPLETE_SINCE: ${{ vars.SESSION_READ_COMPLETE_SINCE }}
      DIRECTORY_WORKSPACES: ${{ vars.SESSION_READ_DIRECTORY_WORKSPACES }}
      BRIEF_TITLES_WORKSPACES: ${{ vars.SESSION_READ_BRIEF_TITLES_WORKSPACES }}
      TIMING_ASSUME_NO_TURNS: ${{ vars.SESSION_READ_TIMING_ASSUME_NO_TURNS }}
      # Owner-buffered (default off); inputs reach the shell only through env.
      OWNER_BUFFERED: ${{ inputs.owner_buffered }}
      OWNER_BUFFERED_WORKSPACES: ${{ inputs.owner_buffered_workspaces }}
      OWNER_BUFFERED_S3_BUCKET: ${{ vars.SESSION_READ_INGEST_S3_BUCKET }}
      OWNER_BUFFERED_S3_REGION: ${{ vars.SESSION_READ_INGEST_S3_REGION }}
      # Owner-buffered session events (default off); the render refuses on without owner_buffered=on.
      OWNER_BUFFERED_EVENTS: ${{ inputs.owner_buffered_events }}
      # Owner-buffered events latency (default off); the render refuses either without owner_buffered_events=on.
      OWNER_BUFFERED_STAGE_CONCURRENCY: ${{ inputs.owner_buffered_stage_concurrency }}
      OWNER_BUFFERED_PHASE_LOG: ${{ inputs.owner_buffered_phase_log }}
      # Buffered search gate (default off); renders the flag and the pinned binding when on.
      BUFFERED_SEARCH_GATE: ${{ inputs.buffered_search_gate }}
      # Agent-name prefix search (default off); renders READ_API_AGENT_MATCH=true when on.
      AGENT_MATCH: ${{ inputs.agent_match }}
    defaults:
      run:
        working-directory: packages/session-read-worker
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (root + workspaces)
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Check the deploy inputs
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'yes' || '' }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          test -n "$HAS_TOKEN" || fail "CLOUDFLARE_API_TOKEN is not set on the session-read-worker environment"
          [[ "$HYPERDRIVE_ID" =~ ^[0-9a-f]{32}$ ]] && [ "$HYPERDRIVE_ID" != "00000000000000000000000000000000" ] || fail "SESSION_READ_HYPERDRIVE_ID must be the Hyperdrive config id (32 hex)"
          test -n "$EXPECTED_CA_ID" || fail "SESSION_READ_SUPABASE_CA_ID must be the uploaded Supabase Root 2021 CA certificate id"
          # The one approved custom-domain origin, exactly as Cloud mints the
          # assertion audience (new URL(...).origin). workers.dev is disabled
          # because same-account Worker fetches through it can fail with 1042.
          test "$ORIGIN" = "https://sessions-read.agentrelay.com" || fail "SESSION_READ_ORIGIN must be https://sessions-read.agentrelay.com"
          if [ "$COMPLETE_SINCE" != "epoch" ]; then
            node -e 'const t=Date.parse(process.argv[1]);if(!/^\d{4}-\d{2}-\d{2}T/.test(process.argv[1])||Number.isNaN(t))process.exit(1)' "$COMPLETE_SINCE" || fail 'SESSION_READ_COMPLETE_SINCE must be an ISO UTC timestamp or "epoch"'
          fi
      - name: Check the live Hyperdrive safety contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs/$HYPERDRIVE_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | bun run scripts/check-hyperdrive-config.ts
      - name: Render the deploy config (Hyperdrive id; control-head binding and flags only when owner_buffered or buffered_search_gate is on)
        run: |
          grep -q '"id": "00000000000000000000000000000000"' wrangler.jsonc
          bun run scripts/render-deploy-config.ts
          grep -q "\"id\": \"$HYPERDRIVE_ID\"" wrangler.deploy.jsonc
      - name: Check the owner-buffered Worker secrets exist (names only; on only)
        if: inputs.owner_buffered == 'on'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          names="$(bunx wrangler secret list --config wrangler.deploy.jsonc --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).map(x=>x.name).sort().join(" ")))')"
          for n in PIPELINE_RAW_S3_ACCESS_KEY_ID PIPELINE_RAW_S3_SECRET_ACCESS_KEY; do
            case " $names " in *" $n "*) ;; *) echo "::error::Worker secret $n is not set; owner-buffered reads would be silently off. Refusing to deploy owner_buffered=on"; exit 1 ;; esac
          done
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bunx wrangler deploy --config wrangler.deploy.jsonc \
            --var "READ_API_ORIGIN:$ORIGIN" \
            --var "READ_API_COMPLETE_SINCE:$COMPLETE_SINCE" \
            ${DIRECTORY_WORKSPACES:+--var "READ_API_DIRECTORY_WORKSPACES:$DIRECTORY_WORKSPACES"} \
            ${BRIEF_TITLES_WORKSPACES:+--var "READ_API_BRIEF_TITLES_WORKSPACES:$BRIEF_TITLES_WORKSPACES"} \
            ${TIMING_ASSUME_NO_TURNS:+--var "READ_API_TIMING_ASSUME_NO_TURNS:$TIMING_ASSUME_NO_TURNS"} \
            --message "96BullSessions ${GITHUB_SHA}"
      - name: Check the Worker's secrets exist (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          names="$(bunx wrangler secret list --config wrangler.deploy.jsonc --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).map(x=>x.name).sort().join(" ")))')"
          for n in CLICKHOUSE_PASSWORD CLICKHOUSE_URL CLICKHOUSE_USER; do
            case " $names " in *" $n "*) ;; *) echo "::error::Worker secret $n is not set; every read answers 503 until it is (runbook step 5)"; exit 1 ;; esac
          done
      - name: Smoke (health 200; an unauthenticated read 401)
        run: |
          curl --fail --silent --show-error --max-time 10 --retry 6 --retry-all-errors --retry-delay 5 "$ORIGIN/health" > /dev/null
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$ORIGIN/v1/events?workspace=x&q=y")"
          test "$code" = "401" || { echo "::error::unauthenticated read returned $code, expected 401"; exit 1; }
