name: deploy session-read-worker
# Deploys the session read Worker (packages/session-read-worker) to the Agent
# Workforce Cloudflare account. Manual only, from main, in the
# `session-read-worker` environment (give it required reviewers); see
# sessions-pipeline-cloud:hosted-ops/preserved/runbooks/sessions-prod-session-read-worker.md.
#
# Environment variables (not secrets; the deploy refuses to run without them):
#   SESSION_READ_HYPERDRIVE_ID   the Hyperdrive config for bulls96_read_api (32 hex)
#   SESSION_READ_SUPABASE_CA_ID   the uploaded Supabase Root 2021 CA certificate id
#   SESSION_READ_ORIGIN          https://sessions-read.agentrelay.com (also Cloud's SESSIONS_READ_96BULLS_URL)
#   SESSION_READ_COMPLETE_SINCE  ISO UTC timestamp ClickHouse is complete from, or "epoch"
#   SESSION_READ_TIMING_ASSUME_NO_TURNS  optional "true" (runbook, "Session timing")
#   SESSION_READ_ANALYSIS_HYPERDRIVE_ID  optional: the Hyperdrive config for bulls96_analysis_admit
#                                (32 hex, caching disabled); unset = no ANALYSIS_ADMIT binding
#   SESSION_READ_RAW_S3_BUCKET / SESSION_READ_RAW_S3_REGION  optional: the raw store the pipeline
#                                writes, when it is not SESSION_READ_INGEST_S3_BUCKET / _REGION
#                                (those are used when these are unset); needed only with
#                                summary_fallback=on or analysis=on
# Environment secret: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, Hyperdrive:Read).
#
# Owner-buffered reads (Option C, src/session-read-api/owner-buffered.ts): a default dispatch
# reproduces prod. Precedence, highest first (scripts/resolve-deploy-profile.ts):
#   1. explicit inputs: owner_buffered=on/off and the child inputs given with it;
#   2. the committed production profile, packages/session-read-worker/deploy/production-profile.json
#      (owner_buffered=on, owner_buffered_workspaces="*", owner_buffered_events=on,
#      owner_buffered_statement_timeout_ms=6000), used only because DEPLOY_TARGET=production below:
#      by owner_buffered=profile (the default), and for a child input left at "profile"/empty under
#      an explicit owner_buffered=on;
#   3. the live Worker version: owner_buffered=preserve (the opt-out from the committed profile),
#      and, in profile mode, everything the profile does not own (S3 bucket/region, stage
#      concurrency, phase log, index verify, exact-session RPC, search gate) and the directory allowlist.
# Profile mode reads live metadata only and is guarded: it may fill a live setting that is unset
# (e.g. the statement timeout a deploy lost) but refuses to change or drop one that is set, refuses
# to turn owner-buffered reads on when live has them off, refuses child overrides (use explicit
# on/off), and, like preserve, refuses unavailable, split or inconsistent live configuration, a
# directory variable/input that differs from live, and any collateral change to an unmanaged
# live setting or binding. Changing the committed profile is a reviewed PR; the first deploy that
# changes a live value is an explicit owner_buffered=on dispatch. owner_buffered=off disables it.
# owner_buffered=on renders
# (scripts/render-deploy-config.ts) the HISTORY_CONTROL_HEAD service binding to
# relayhistory-api's named entrypoint SessionReadPrivacyControls (pinned in the script),
# RELAYHISTORY_READ_OWNER_BUFFERED=true, READ_API_OWNER_BUFFERED_WORKSPACES from the
# owner_buffered_workspaces input (explicit ids, each also on
# SESSION_READ_DIRECTORY_WORKSPACES; or exactly "*", the all-workspaces mode, accepted only
# when SESSION_READ_DIRECTORY_WORKSPACES is itself exactly "*"; "*" mixed with ids is
# refused; the per-user privacy gate is unchanged in either case), and, from environment
# variables required only then:
#   SESSION_READ_INGEST_S3_BUCKET  the ingest bucket holding buffered-batches/ (INGEST_S3_BUCKET)
#   SESSION_READ_INGEST_S3_REGION  its region (INGEST_S3_REGION)
# The S3 credentials are the Worker's PIPELINE_RAW_S3_ACCESS_KEY_ID / _SECRET_ACCESS_KEY
# secrets (wrangler secret put; GetObject + kms:Decrypt on buffered-batches/ is a separate
# IAM grant); an on deploy refuses to run unless both exist. Default dispatches keep it on.
#
# owner_buffered_events=on (valid only with owner_buffered=on; the render refuses it otherwise)
# adds READ_API_OWNER_BUFFERED_EVENTS=on: owner-buffered session events on
# GET /v1/sessions/:sessionId/events with `source`. off (or no input) renders exactly the
# owner_buffered render without it; "profile" (the default) takes the committed value. Changing it
# is a production change: dispatch is Khaliq's call. Default dispatches render the committed value.
#
# owner_buffered_stage_concurrency=2..32 and owner_buffered_phase_log=on (valid only with
# owner_buffered_events=on; the render refuses them otherwise) add
# READ_API_OWNER_BUFFERED_STAGE_CONCURRENCY=<n> (at most n S3 stage GetObjects in flight per
# owner-buffered events read; the authority checks keep their order) and
# READ_API_OWNER_BUFFERED_PHASE_LOG=1 (per-phase *_ms fields on the request log line). off (or no
# input) renders exactly the render without them. Dispatch is Khaliq's call; every later dispatch
# without changes preserves the live settings.
#
# owner_buffered_index_verify=on (valid only with owner_buffered=on; the render refuses it
# otherwise) adds READ_API_OWNER_BUFFERED_INDEX_VERIFY=on: every owner-buffered read first proves
# the out-of-band index ingest_buffer_outbox_user_buffered_idx (migration 20261105043700, built
# CONCURRENTLY by an operator) exists and is valid, else the buffered read is fenced. off (or no
# input) renders exactly the render without it. Dispatch is Khaliq's call; every later dispatch
# without changes preserves the live setting.
#
# Buffered search gate (src/session-read-api/buffered-search-gate.ts, PR #338), default off.
# buffered_search_gate=off (or no input) changes nothing: under owner_buffered=profile or preserve the
# live gate is kept as it is, and under explicit on/off no gate is rendered. buffered_search_gate=on renders READ_API_BUFFERED_SEARCH_GATE=on and
# the same pinned HISTORY_CONTROL_HEAD binding (once, also when owner_buffered=on); it needs no
# workspace list and no S3, and refuses any other value. The gate drops every buffered-origin
# search hit it cannot prove visible, so it must be deployed BEFORE the buffered search feeder
# (#339) is enabled. Turning it on is a production change: dispatch is Khaliq's call. Every later
# dispatch without feature changes preserves the live gate.
#
# Brief summaries (src/session-read-api/brief-summary.ts; hosted-Lambda parity), default off.
# brief_summary=on adds --var READ_API_BRIEF_SUMMARY_ENABLED:true (GET /v1/sessions/:id/summary);
# list_short_summary=on adds --var READ_API_LIST_SHORT_SUMMARY_ENABLED:true (the GET /v1/sessions
# includeShortSummary=recorded extension). off (the default) renders neither var, so the Worker
# answers 501 summary_not_configured / param_includeShortSummary exactly as before these inputs.
# list_readiness=on adds --var READ_API_LIST_READINESS_ENABLED:true (the GET /v1/sessions
# includeReadiness=true / readyOnly=true opt-ins; migration 20261105062200 must be applied first, or
# those requests answer 501 directory_not_migrated). off (the default) renders no var: either param
# answers 501 param_includeReadiness / param_readyOnly, and the list is unchanged.
# None of these three (brief_summary, list_short_summary, list_readiness) is preserved from live: once
# one is on, a later profile/preserve dispatch must repeat it (the live-settings guard refuses a dispatch
# that would drop it). Dispatch is Khaliq's call.
# summary_fallback=on (only with brief_summary=on) adds --var READ_API_SUMMARY_FALLBACK_ENABLED:true:
# the same route also serves Bob Costas's encrypted summary objects (kind=short without a brief,
# kind=long; src/session-read-api/summary-fallback.ts). It needs the Worker secrets
# SUMMARY_MASTER_KEYS and PIPELINE_RAW_S3_*; an on dispatch fails before `wrangler deploy` unless
# all three secrets exist on the Worker (names only). It also renders (scripts/render-deploy-config.ts)
# the plain raw-store vars the Worker reads the objects with: PIPELINE_RAW_S3_BUCKET and
# PIPELINE_RAW_S3_REGION from SESSION_READ_RAW_S3_BUCKET / _REGION, else
# SESSION_READ_INGEST_S3_BUCKET / _REGION, plus PIPELINE_KEY_PREFIX (TENANT_KEY_BASE,
# stacks/aws/tenants.ts) and PIPELINE_ORG_FROM_PREFIX=true, the hosted pipeline's org-derived key
# layout. An on dispatch fails before `wrangler deploy` while the bucket or region is unset or
# malformed (names only). A wrong bucket fails closed: the Worker refuses every pointer row whose
# bucket differs (503 backend_unavailable, logged summary_fallback_pointer_invalid), never an empty
# answer. The fallback to SESSION_READ_INGEST_S3_* is correct only when the pipeline's raw store is
# the same bucket; otherwise set SESSION_READ_RAW_S3_*. With summary_fallback and analysis both off
# the render is byte-identical to before.
# The render does NOT turn on hosted timing, turns or metadata reads (nor owner-buffered turns,
# hosted canonical events, babysitter evidence or /v1/canonical/*), which read the same raw store
# without a flag of their own: when an on dispatch introduces the raw store, the resolve step
# (resolve-deploy-profile.ts rawStoreOtherReads, from the live Worker, fail-closed) renders
# READ_API_RAW_STORE_OTHER_READS=off beside the vars; a raw store already live without that switch
# gets none, and a live switch is kept. Turning those reads on is a separate decision with its own
# step (removing the switch), never part of this dispatch.
# Same not-preserved rule; dispatch, and putting that secret on the Worker, are Khaliq's call.
# summary_search=on adds --var READ_API_SUMMARY_SEARCH_ENABLED:true: GET /v1/sessions/summaries/search
# over ClickHouse session_brief_documents (docs/ch-brief-search-design.md; needs no other input and
# no new secret). off (the default) renders no var: 501 summary_search_not_configured, as before
# this input. Same not-preserved rule (the live-settings guard refuses a dispatch that would drop
# a live one); dispatch is Khaliq's call.
# relayfacts=on adds --var READ_API_RELAYFACTS_ENABLED:true: GET /v1/relayfacts and
# GET /v1/relayfacts/:topic (docs/relayfacts.md; needs migrations 062080 and 062090 and, per
# workspace, the relayfacts canary; no new secret). off (the default) renders no var: 501
# relayfacts_disabled, as before this input. Same not-preserved rule; dispatch is Khaliq's call.
# session_sources=on adds --var READ_API_SESSION_SOURCES_ENABLED:true: GET
# /v1/sessions/:sessionId/sources, the live harnesses of one session id from session_index through
# the read role's existing columns (no migration, no grant, no secret). off (the default) renders
# no var: 501 sources_not_configured. Same not-preserved rule; dispatch is Khaliq's call.
# The live-settings guard behind that rule runs only in profile/preserve mode (owner_buffered unset,
# profile or preserve): with an explicit owner_buffered=on|off, an off summary/sources input drops a
# live var without a refusal (true of every input above).
#
# Session analysis (lane F1, src/session-read-api/analysis-source.ts), default off.
# analysis=on adds --var READ_API_ANALYSIS_ENABLED:true: GET /v1/sessions/:id/analysis
# (sessions.analysis_read_v1 as bulls96_read_api, result objects normalized/session-analysis-v2/*
# from the PIPELINE_RAW_S3_* raw store) and POST /v1/sessions/:id/analysis (the one non-GET route,
# sessions.analysis_request_v1 as bulls96_analysis_admit). POST needs the ANALYSIS_ADMIT Hyperdrive
# binding, rendered only when the environment variable SESSION_READ_ANALYSIS_HYPERDRIVE_ID is set
# (its live config is checked first: caching disabled, verify-full, the admission role's user);
# without it POST answers 501 analysis_admission_not_configured and GET still serves. An on dispatch
# fails before `wrangler deploy` unless the PIPELINE_RAW_S3_* secrets exist (names only), and
# renders the same plain raw-store vars as summary_fallback=on (bucket and region required, from
# the same variables and the same READ_API_RAW_STORE_OTHER_READS rule; a wrong bucket fails closed:
# the result-object read fails and GET serves an error, never another object: 503
# backend_unavailable (logged reason, for example analysis_result_missing)). This wiring is
# additional scope: it gives no authority to enable or deploy analysis. off (the default)
# renders no var: GET 501 analysis_not_configured and POST 405, as before this input. A
# profile/preserve dispatch refuses to drop or change live raw-store vars; analysis=disable without
# summary_fallback=on drops them with the switch, and is refused while they are live without
# READ_API_RAW_STORE_OTHER_READS (timing, turns and metadata read through them) or the bucket is a
# secret. Break-glass (below) refuses summary_fallback=on.
# The ANALYSIS_ADMIT binding is rendered whenever SESSION_READ_ANALYSIS_HYPERDRIVE_ID is set, whatever
# `analysis` says (a flag-off Worker ignores it); the render is byte-identical to before only with
# that variable unset. Not preserved from live: in EVERY mode (profile, preserve, and explicit
# owner_buffered=on/off) the guard (resolve-deploy-profile.ts unchangedAnalysisSettings) refuses a
# dispatch that would drop a live READ_API_ANALYSIS_ENABLED or change/drop a live ANALYSIS_ADMIT
# binding; analysis=disable is the explicit removal (no var, and the binding may go when the
# variable is unset; a set variable must name the live binding's config, never replace it). The
# other summary inputs keep their profile/preserve-only guard. Break-glass: explicit
# owner_buffered=on/off WITH a directory (input or SESSION_READ_DIRECTORY_WORKSPACES) AND
# analysis=disable reads no live metadata at all, so it deploys even when the live Worker is split,
# absent or unreadable (a set SESSION_READ_ANALYSIS_HYPERDRIVE_ID then renders unchecked). Any other
# explicit dispatch reads live for the analysis guard; with a directory it does not pin that version
# (no PRESERVED_READER_VERSION, so the pre-deploy live-version check is skipped). Dispatch is
# Khaliq's call.
#
# The Worker's own secrets (CLICKHOUSE_URL, CLICKHOUSE_USER, CLICKHOUSE_PASSWORD)
# are never handled here: they are set with `wrangler secret put` from 1Password
# and survive deploys. This workflow checks that they exist, by name only.
on:
  workflow_dispatch:
    inputs:
      owner_buffered:
        description: 'profile (default) = committed production profile, guarded against live; preserve = copy live; on/off explicitly changes it'
        type: choice
        options: ["profile", "preserve", "on", "off"]
        default: "profile"
      owner_buffered_workspaces:
        description: 'Canary workspace ids, comma-separated, or exactly "*" for all workspaces (only if SESSION_READ_DIRECTORY_WORKSPACES is "*"); empty = committed profile with explicit on'
        type: string
        default: ""
      directory_workspaces:
        description: 'Directory ids or "*"; "off" explicitly disables. Empty uses the environment variable when set, otherwise preserves live. Changes require explicit owner_buffered=on/off.'
        type: string
        default: ""
      owner_buffered_exact_session:
        description: 047010 RPC; on requires applied migration and explicit owner_buffered=on; off preserves live in profile/preserve, otherwise disables
        type: choice
        options: ["off", "on"]
        default: "off"
      owner_buffered_stages_paged:
        description: 047020 paged stages RPC; on requires applied migration, owner_buffered=on and owner_buffered_exact_session=on; off preserves live in profile/preserve, otherwise disables
        type: choice
        options: ["off", "on"]
        default: "off"
      owner_buffered_events:
        description: Owner-buffered session events (GET /v1/sessions/:id/events with source); valid only with owner_buffered=on. profile = committed value; off = exactly the owner_buffered render
        type: choice
        options: ["profile", "off", "on"]
        default: "profile"
      owner_buffered_statement_timeout_ms:
        description: profile = committed value; with explicit on, off keeps runtime default, or integer 2000..6000 ms
        type: string
        default: "profile"
      owner_buffered_stage_concurrency:
        description: 'Owner-buffered events: S3 stage GetObjects in flight, "off" or an integer 2..32; valid only with owner_buffered_events=on. off = the serial fetch'
        type: string
        default: "off"
      owner_buffered_phase_log:
        description: Owner-buffered events per-phase log fields; valid only with owner_buffered_events=on. off = exactly the render without them
        type: choice
        options: ["off", "on"]
        default: "off"
      owner_buffered_index_verify:
        description: Owner-buffered reads verify the out-of-band ingest_buffer_outbox_user_buffered_idx first; valid only with owner_buffered=on. off = exactly the render without it
        type: choice
        options: ["off", "on"]
        default: "off"
      buffered_search_gate:
        description: Per-hit privacy gate for buffered search hits (#338); needs no other input. off = keep the live gate (profile/preserve) or render none (explicit on/off)
        type: choice
        options: ["off", "on"]
        default: "off"
      brief_summary:
        description: GET /v1/sessions/:id/summary (READ_API_BRIEF_SUMMARY_ENABLED=true); off = no var, 501 summary_not_configured. Not preserved from live; repeat it on later dispatches
        type: choice
        options: ["off", "on"]
        default: "off"
      list_short_summary:
        description: GET /v1/sessions includeShortSummary=recorded (READ_API_LIST_SHORT_SUMMARY_ENABLED=true); off = no var, 501 param_includeShortSummary. Not preserved from live; repeat it on later dispatches
        type: choice
        options: ["off", "on"]
        default: "off"
      list_readiness:
        description: GET /v1/sessions includeReadiness=true / readyOnly=true (READ_API_LIST_READINESS_ENABLED=true; needs migration 062200); off = no var, 501 param_includeReadiness / param_readyOnly. Not preserved from live; repeat it on later dispatches
        type: choice
        options: ["off", "on"]
        default: "off"
      summary_fallback:
        description: GET /v1/sessions/:id/summary Bob Costas fallback + kind=long (READ_API_SUMMARY_FALLBACK_ENABLED=true; needs brief_summary=on and the SUMMARY_MASTER_KEYS secret); off = no var, route unchanged. Not preserved from live
        type: choice
        options: ["off", "on"]
        default: "off"
      summary_search:
        description: GET /v1/sessions/summaries/search (READ_API_SUMMARY_SEARCH_ENABLED=true); off = no var, 501 summary_search_not_configured. Not preserved from live; repeat it on later dispatches
        type: choice
        options: ["off", "on"]
        default: "off"
      relayfacts:
        description: GET /v1/relayfacts and /v1/relayfacts/:topic (READ_API_RELAYFACTS_ENABLED=true); off = no var, 501 relayfacts_disabled. Not preserved from live; repeat it on later dispatches
        type: choice
        options: ["off", "on"]
        default: "off"
      session_sources:
        description: GET /v1/sessions/:sessionId/sources (READ_API_SESSION_SOURCES_ENABLED=true); off = no var, 501 sources_not_configured. Not preserved from live; repeat it on later dispatches
        type: choice
        options: ["off", "on"]
        default: "off"
      analysis:
        description: GET/POST /v1/sessions/:id/analysis (READ_API_ANALYSIS_ENABLED=true; POST needs SESSION_READ_ANALYSIS_HYPERDRIVE_ID); off = no var, refused if live has it on; disable = remove it. Not preserved from live; repeat on later dispatches
        type: choice
        options: ["off", "on", "disable"]
        default: "off"
permissions:
  contents: read
concurrency:
  group: session-read-worker-production
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/session-read-worker-checks.yml
    with:
      ref: ${{ github.sha }}

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment: session-read-worker
    env:
      # This workflow deploys only production; the committed production profile applies only here.
      DEPLOY_TARGET: production
      CLOUDFLARE_ACCOUNT_ID: f7232cb80f6fab86a95426302af243e4
      # CLOUDFLARE_API_TOKEN is given only to the steps that call Cloudflare,
      # never to install (dependency scripts) or the input checks.
      HYPERDRIVE_ID: ${{ vars.SESSION_READ_HYPERDRIVE_ID }}
      EXPECTED_CA_ID: ${{ vars.SESSION_READ_SUPABASE_CA_ID }}
      ORIGIN: ${{ vars.SESSION_READ_ORIGIN }}
      COMPLETE_SINCE: ${{ vars.SESSION_READ_COMPLETE_SINCE }}
      DIRECTORY_WORKSPACES: ${{ vars.SESSION_READ_DIRECTORY_WORKSPACES }}
      DIRECTORY_WORKSPACES_INPUT: ${{ inputs.directory_workspaces }}
      BRIEF_TITLES_WORKSPACES: ${{ vars.SESSION_READ_BRIEF_TITLES_WORKSPACES }}
      TIMING_ASSUME_NO_TURNS: ${{ vars.SESSION_READ_TIMING_ASSUME_NO_TURNS }}
      # Owner-buffered (default: committed production profile); inputs reach the shell only through env.
      OWNER_BUFFERED: ${{ inputs.owner_buffered }}
      OWNER_BUFFERED_WORKSPACES: ${{ inputs.owner_buffered_workspaces }}
      OWNER_BUFFERED_S3_BUCKET: ${{ vars.SESSION_READ_INGEST_S3_BUCKET }}
      OWNER_BUFFERED_S3_REGION: ${{ vars.SESSION_READ_INGEST_S3_REGION }}
      # Owner-buffered session events (default off); the render refuses on without owner_buffered=on.
      OWNER_BUFFERED_EVENTS: ${{ inputs.owner_buffered_events }}
      OWNER_BUFFERED_EXACT_SESSION: ${{ inputs.owner_buffered_exact_session }}
      OWNER_BUFFERED_STAGES_PAGED: ${{ inputs.owner_buffered_stages_paged }}
      OWNER_BUFFERED_STATEMENT_TIMEOUT_MS: ${{ inputs.owner_buffered_statement_timeout_ms }}
      # Owner-buffered events latency (default off); the render refuses either without owner_buffered_events=on.
      OWNER_BUFFERED_STAGE_CONCURRENCY: ${{ inputs.owner_buffered_stage_concurrency }}
      OWNER_BUFFERED_PHASE_LOG: ${{ inputs.owner_buffered_phase_log }}
      # Owner-buffered out-of-band index check (default off); the render refuses on without owner_buffered=on.
      OWNER_BUFFERED_INDEX_VERIFY: ${{ inputs.owner_buffered_index_verify }}
      # Buffered search gate (default off); renders the flag and the pinned binding when on.
      BUFFERED_SEARCH_GATE: ${{ inputs.buffered_search_gate }}
      # Brief summaries (default off); on adds the exact "true" var on the deploy command only.
      BRIEF_SUMMARY: ${{ inputs.brief_summary }}
      LIST_SHORT_SUMMARY: ${{ inputs.list_short_summary }}
      LIST_READINESS: ${{ inputs.list_readiness }}
      SUMMARY_FALLBACK: ${{ inputs.summary_fallback }}
      SUMMARY_SEARCH: ${{ inputs.summary_search }}
      RELAYFACTS: ${{ inputs.relayfacts }}
      SESSION_SOURCES: ${{ inputs.session_sources }}
      # Session analysis (default off); on adds the exact "true" var on the deploy command only.
      ANALYSIS: ${{ inputs.analysis }}
      # The admission principal's Hyperdrive (optional); set = the ANALYSIS_ADMIT binding is rendered.
      ANALYSIS_HYPERDRIVE_ID: ${{ vars.SESSION_READ_ANALYSIS_HYPERDRIVE_ID }}
      # The raw store (rendered only with summary_fallback=on or analysis=on): the override when set, else the ingest bucket.
      RAW_S3_BUCKET: ${{ vars.SESSION_READ_RAW_S3_BUCKET || vars.SESSION_READ_INGEST_S3_BUCKET }}
      RAW_S3_REGION: ${{ vars.SESSION_READ_RAW_S3_REGION || vars.SESSION_READ_INGEST_S3_REGION }}
    defaults:
      run:
        working-directory: packages/session-read-worker
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (root + workspaces)
        working-directory: .
        run: bun install --frozen-lockfile
      - name: Resolve the read profile (explicit inputs > committed production profile > live; read-only)
        id: resolve-profile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run scripts/resolve-deploy-profile.ts
      - name: Check the deploy inputs
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && 'yes' || '' }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          test -n "$HAS_TOKEN" || fail "CLOUDFLARE_API_TOKEN is not set on the session-read-worker environment"
          [[ "$HYPERDRIVE_ID" =~ ^[0-9a-f]{32}$ ]] && [ "$HYPERDRIVE_ID" != "00000000000000000000000000000000" ] || fail "SESSION_READ_HYPERDRIVE_ID must be the Hyperdrive config id (32 hex)"
          test -n "$EXPECTED_CA_ID" || fail "SESSION_READ_SUPABASE_CA_ID must be the uploaded Supabase Root 2021 CA certificate id"
          # The one approved custom-domain origin, exactly as Cloud mints the
          # assertion audience (new URL(...).origin). workers.dev is disabled
          # because same-account Worker fetches through it can fail with 1042.
          test "$ORIGIN" = "https://sessions-read.agentrelay.com" || fail "SESSION_READ_ORIGIN must be https://sessions-read.agentrelay.com"
          case "$BRIEF_SUMMARY" in off|on) ;; *) fail 'brief_summary must be "off" or "on"' ;; esac
          case "$LIST_SHORT_SUMMARY" in off|on) ;; *) fail 'list_short_summary must be "off" or "on"' ;; esac
          case "$LIST_READINESS" in off|on) ;; *) fail 'list_readiness must be "off" or "on"' ;; esac
          case "$SUMMARY_FALLBACK" in off|on) ;; *) fail 'summary_fallback must be "off" or "on"' ;; esac
          case "$SUMMARY_SEARCH" in off|on) ;; *) fail 'summary_search must be "off" or "on"' ;; esac
          case "$RELAYFACTS" in off|on) ;; *) fail 'relayfacts must be "off" or "on"' ;; esac
          case "$SESSION_SOURCES" in off|on) ;; *) fail 'session_sources must be "off" or "on"' ;; esac
          case "$ANALYSIS" in off|on|disable) ;; *) fail 'analysis must be "off", "on" or "disable"' ;; esac
          if [ -n "$ANALYSIS_HYPERDRIVE_ID" ]; then
            [[ "$ANALYSIS_HYPERDRIVE_ID" =~ ^[0-9a-f]{32}$ ]] && [ "$ANALYSIS_HYPERDRIVE_ID" != "00000000000000000000000000000000" ] || fail "SESSION_READ_ANALYSIS_HYPERDRIVE_ID must be the admission role's Hyperdrive config id (32 hex)"
            [ "$ANALYSIS_HYPERDRIVE_ID" != "$HYPERDRIVE_ID" ] || fail "SESSION_READ_ANALYSIS_HYPERDRIVE_ID must not be the read role's Hyperdrive config"
          elif [ "$ANALYSIS" = "on" ]; then
            echo "::warning::analysis=on without SESSION_READ_ANALYSIS_HYPERDRIVE_ID: GET serves, POST answers 501 analysis_admission_not_configured"
          fi
          if [ "$SUMMARY_FALLBACK" = "on" ] && [ "$BRIEF_SUMMARY" != "on" ]; then fail 'summary_fallback=on needs brief_summary=on'; fi
          # Names only: the raw store the render adds for summary_fallback=on or analysis=on.
          if [ "$SUMMARY_FALLBACK" = "on" ] || [ "$ANALYSIS" = "on" ]; then
            test -n "$RAW_S3_BUCKET" || fail "summary_fallback=on or analysis=on needs SESSION_READ_RAW_S3_BUCKET or SESSION_READ_INGEST_S3_BUCKET"
            test -n "$RAW_S3_REGION" || fail "summary_fallback=on or analysis=on needs SESSION_READ_RAW_S3_REGION or SESSION_READ_INGEST_S3_REGION"
          fi
          if [ "$COMPLETE_SINCE" != "epoch" ]; then
            node -e 'const t=Date.parse(process.argv[1]);if(!/^\d{4}-\d{2}-\d{2}T/.test(process.argv[1])||Number.isNaN(t))process.exit(1)' "$COMPLETE_SINCE" || fail 'SESSION_READ_COMPLETE_SINCE must be an ISO UTC timestamp or "epoch"'
          fi
      - name: Check the live Hyperdrive safety contract
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs/$HYPERDRIVE_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | bun run scripts/check-hyperdrive-config.ts
      - name: Check the live admission Hyperdrive safety contract (only when SESSION_READ_ANALYSIS_HYPERDRIVE_ID is set)
        if: env.ANALYSIS_HYPERDRIVE_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs/$ANALYSIS_HYPERDRIVE_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | HYPERDRIVE_ID="$ANALYSIS_HYPERDRIVE_ID" HYPERDRIVE_ROLE=analysis_admit bun run scripts/check-hyperdrive-config.ts
      - name: Render the deploy config (Hyperdrive id; control-head binding and flags only when owner_buffered or buffered_search_gate is on)
        run: |
          grep -q '"id": "00000000000000000000000000000000"' wrangler.jsonc
          bun run scripts/render-deploy-config.ts
          grep -q "\"id\": \"$HYPERDRIVE_ID\"" wrangler.deploy.jsonc
          if [ -n "$ANALYSIS_HYPERDRIVE_ID" ]; then
            grep -q "\"id\": \"$ANALYSIS_HYPERDRIVE_ID\"" wrangler.deploy.jsonc
          elif grep -q '"ANALYSIS_ADMIT"' wrangler.deploy.jsonc; then
            echo "::error::ANALYSIS_ADMIT rendered without SESSION_READ_ANALYSIS_HYPERDRIVE_ID"; exit 1
          fi
      - name: Check the owner-buffered Worker secrets exist (names only; on only)
        if: steps.resolve-profile.outputs.owner_buffered == 'on'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          names="$(bunx wrangler secret list --config wrangler.deploy.jsonc --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).map(x=>x.name).sort().join(" ")))')"
          for n in PIPELINE_RAW_S3_ACCESS_KEY_ID PIPELINE_RAW_S3_SECRET_ACCESS_KEY; do
            case " $names " in *" $n "*) ;; *) echo "::error::Worker secret $n is not set; owner-buffered reads would be silently off. Refusing to deploy owner_buffered=on"; exit 1 ;; esac
          done
      - name: Check the summary-fallback Worker secrets exist before deploying (names only; summary_fallback=on only)
        if: env.SUMMARY_FALLBACK == 'on'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          names="$(bunx wrangler secret list --config wrangler.deploy.jsonc --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).map(x=>x.name).sort().join(" ")))')"
          for n in SUMMARY_MASTER_KEYS PIPELINE_RAW_S3_ACCESS_KEY_ID PIPELINE_RAW_S3_SECRET_ACCESS_KEY; do
            case " $names " in *" $n "*) ;; *) echo "::error::Worker secret $n is not set; summary fallback reads would answer 501 summary_fallback_not_configured. Refusing to deploy summary_fallback=on"; exit 1 ;; esac
          done
      - name: Check the analysis Worker secrets exist before deploying (names only; analysis=on only)
        if: env.ANALYSIS == 'on'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          names="$(bunx wrangler secret list --config wrangler.deploy.jsonc --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).map(x=>x.name).sort().join(" ")))')"
          for n in PIPELINE_RAW_S3_ACCESS_KEY_ID PIPELINE_RAW_S3_SECRET_ACCESS_KEY; do
            case " $names " in *" $n "*) ;; *) echo "::error::Worker secret $n is not set; analysis reads would answer 501 analysis_not_configured. Refusing to deploy analysis=on"; exit 1 ;; esac
          done
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun run scripts/resolve-deploy-profile.ts --check-live-version
          brief_summary=""; if [ "$BRIEF_SUMMARY" = "on" ]; then brief_summary=true; fi
          list_short_summary=""; if [ "$LIST_SHORT_SUMMARY" = "on" ]; then list_short_summary=true; fi
          list_readiness=""; if [ "$LIST_READINESS" = "on" ]; then list_readiness=true; fi
          summary_fallback=""; if [ "$SUMMARY_FALLBACK" = "on" ]; then summary_fallback=true; fi
          summary_search=""; if [ "$SUMMARY_SEARCH" = "on" ]; then summary_search=true; fi
          relayfacts=""; if [ "$RELAYFACTS" = "on" ]; then relayfacts=true; fi
          session_sources=""; if [ "$SESSION_SOURCES" = "on" ]; then session_sources=true; fi
          analysis=""; if [ "$ANALYSIS" = "on" ]; then analysis=true; fi
          bunx wrangler deploy --config wrangler.deploy.jsonc \
            --var "READ_API_ORIGIN:$ORIGIN" \
            --var "READ_API_COMPLETE_SINCE:$COMPLETE_SINCE" \
            ${DIRECTORY_WORKSPACES:+--var "READ_API_DIRECTORY_WORKSPACES:$DIRECTORY_WORKSPACES"} \
            ${BRIEF_TITLES_WORKSPACES:+--var "READ_API_BRIEF_TITLES_WORKSPACES:$BRIEF_TITLES_WORKSPACES"} \
            ${TIMING_ASSUME_NO_TURNS:+--var "READ_API_TIMING_ASSUME_NO_TURNS:$TIMING_ASSUME_NO_TURNS"} \
            ${brief_summary:+--var "READ_API_BRIEF_SUMMARY_ENABLED:$brief_summary"} \
            ${list_short_summary:+--var "READ_API_LIST_SHORT_SUMMARY_ENABLED:$list_short_summary"} \
            ${list_readiness:+--var "READ_API_LIST_READINESS_ENABLED:$list_readiness"} \
            ${summary_fallback:+--var "READ_API_SUMMARY_FALLBACK_ENABLED:$summary_fallback"} \
            ${summary_search:+--var "READ_API_SUMMARY_SEARCH_ENABLED:$summary_search"} \
            ${relayfacts:+--var "READ_API_RELAYFACTS_ENABLED:$relayfacts"} \
            ${session_sources:+--var "READ_API_SESSION_SOURCES_ENABLED:$session_sources"} \
            ${analysis:+--var "READ_API_ANALYSIS_ENABLED:$analysis"} \
            --message "96BullSessions ${GITHUB_SHA}"
      - name: Check the Worker's secrets exist (names only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          names="$(bunx wrangler secret list --config wrangler.deploy.jsonc --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).map(x=>x.name).sort().join(" ")))')"
          for n in CLICKHOUSE_PASSWORD CLICKHOUSE_URL CLICKHOUSE_USER; do
            case " $names " in *" $n "*) ;; *) echo "::error::Worker secret $n is not set; every read answers 503 until it is (runbook step 5)"; exit 1 ;; esac
          done
      - name: Smoke (health 200; an unauthenticated read 401)
        run: |
          curl --fail --silent --show-error --max-time 10 --retry 6 --retry-all-errors --retry-delay 5 "$ORIGIN/health" > /dev/null
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 "$ORIGIN/v1/events?workspace=x&q=y")"
          test "$code" = "401" || { echo "::error::unauthenticated read returned $code, expected 401"; exit 1; }
