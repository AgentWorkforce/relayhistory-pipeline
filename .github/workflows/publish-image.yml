# Publishes the 96bulls services image to GHCR by digest.
# Manual only, and refuses to run unless the dispatcher types the confirmation
# phrase, because a registry write is a credential action that needs Khaliq's OK.
name: publish-image
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish 96bulls-services" to confirm Khaliq approved this publish'
        required: true
      ref_note:
        description: 'Where the approval was given (date, call/message)'
        required: true
      source_sha:
        description: 'Reviewed full 40-character source commit on main (defaults to this workflow commit)'
        required: false
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  publish:
    # Only Khaliq may dispatch it, only from main, and only with the phrase; the job also runs in the
    # image-publish environment so a protection rule can add a second gate when the plan allows it.
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'khaliqgant' && github.event.inputs.confirm == 'publish 96bulls-services' }}
    environment: image-publish
    runs-on: ${{ vars.DEPLOY_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Validate requested source commit
        env:
          SOURCE_SHA: ${{ github.event.inputs.source_sha || github.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Source must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.inputs.source_sha || github.sha }}
      # A customer image must come from a reviewed commit on main.
      - name: Verify the source commit is reviewed on main
        id: source
        env:
          SOURCE_SHA: ${{ github.event.inputs.source_sha || github.sha }}
        run: |
          git fetch --no-tags origin main
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$SOURCE_SHA" ]]; then
            echo "Checked out source differs from the requested commit" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$actual" origin/main; then
            echo "Refusing to publish ${actual}: it is not on main" >&2
            exit 1
          fi
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          echo "Reviewed image source: $actual" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/services.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # A pinned older source gets only its SHA tag; it must not move :main backwards.
          tags: |
            ghcr.io/agentworkforce/96bulls-services:sha-${{ steps.source.outputs.sha }}
            ${{ github.ref == 'refs/heads/main' && steps.source.outputs.sha == github.sha && 'ghcr.io/agentworkforce/96bulls-services:main' || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            96bulls.approval=${{ github.event.inputs.ref_note }}
          # Customer releases need an SBOM and verifiable (max-mode) provenance;
          # the signed GitHub attestation below covers the pushed digest.
          provenance: mode=max
          sbom: true
      - name: Attest published image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/agentworkforce/96bulls-services
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      # GitHub provenance identifies the workflow commit. Also bind the actual
      # reviewed checkout when publication deliberately uses an older source.
      - name: Attest reviewed image source
        uses: actions/attest@ce27ba3b4a9a139d9a20a4a07d69fabb52f1e5bc # v2.4.0
        with:
          subject-name: ghcr.io/agentworkforce/96bulls-services
          subject-digest: ${{ steps.build.outputs.digest }}
          predicate-type: https://agentrelay.com/attestations/reviewed-image-source/v1
          predicate: >-
            {
              "repository": "${{ github.server_url }}/${{ github.repository }}",
              "source_sha": "${{ steps.source.outputs.sha }}",
              "workflow_sha": "${{ github.sha }}",
              "source_ref": "refs/heads/main"
            }
          push-to-registry: true
      - name: Digest
        run: |
          echo "ghcr.io/agentworkforce/96bulls-services@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
