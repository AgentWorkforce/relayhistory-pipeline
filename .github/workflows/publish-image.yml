# Publishes the 96bulls services image to GHCR by digest.
# Manual only, and refuses to run unless the dispatcher types the confirmation
# phrase, because a registry write is a credential action that needs Khaliq's OK.
name: publish-image
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish 96bulls-services" to confirm Khaliq approved this publish'
        required: true
      ref_note:
        description: 'Where the approval was given (date, call/message)'
        required: true
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  publish:
    # Only Khaliq may dispatch it, and only with the phrase; the job also runs in the
    # image-publish environment so a protection rule can add a second gate when the plan allows it.
    if: ${{ github.actor == 'khaliqgant' && github.event.inputs.confirm == 'publish 96bulls-services' }}
    environment: image-publish
    runs-on: ${{ vars.DEPLOY_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      # A customer image must come from a reviewed commit on main.
      - name: Verify the source commit is reviewed on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$(git rev-parse "${GITHUB_SHA}^{commit}")" origin/main; then
            echo "Refusing to publish ${GITHUB_SHA}: it is not on main" >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/services.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # The moving :main tag is written only from main; any other ref gets its sha tag only.
          tags: |
            ghcr.io/agentworkforce/96bulls-services:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/agentworkforce/96bulls-services:main' || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            96bulls.approval=${{ github.event.inputs.ref_note }}
          # Customer releases need an SBOM and verifiable (max-mode) provenance;
          # the signed GitHub attestation below covers the pushed digest.
          provenance: mode=max
          sbom: true
      - name: Attest published image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/agentworkforce/96bulls-services
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Digest
        run: |
          echo "ghcr.io/agentworkforce/96bulls-services@${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
