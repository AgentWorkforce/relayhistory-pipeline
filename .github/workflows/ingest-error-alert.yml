name: ingest error alert
run-name: ingest error alert ${{ inputs.mode }} ${{ inputs.sha }}

# The ingest DB-error alert (src/session-ingest/ingest-error-alert.ts; runbooks/history-620-operations.md
# "Ingest DB-error alert"): one Cloudflare Notifications custom alert (custom_analytics, SQL over Workers Logs) on
# the private ingest Worker's log lines, notifying the Agent Relay webhook destination. It never touches the Worker,
# its profile or the private-ingest release contract. plan is read-only; apply re-plans, requires the confirmation
# printed by plan for the same body digest, writes the one policy and reads it back.
#
# Protected environment `ingest-alerting-production` (main only, Khaliq as required reviewer):
#   secret   CLOUDFLARE_ALERTING_API_TOKEN  account token: Notifications Write (policies), read of destinations
#   variable INGEST_ALERT_WEBHOOK_ID        the generic webhook destination `96bulls-ingest-alerts-agent-relay`
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [plan, apply]
        default: plan
        required: true
      sha:
        description: Exact current main commit (40 lowercase hex)
        type: string
        required: true
      confirmation:
        description: 'Apply: APPLY-INGEST-DB-ERROR-ALERT <sha> BODY <digest>, printed by plan at the same sha. Plan: empty'
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: ingest-error-alert-production
  cancel-in-progress: false

env:
  INGEST_ALERT_MODE: ${{ inputs.mode }}
  INGEST_ALERT_SHA: ${{ inputs.sha }}
  INGEST_ALERT_CONFIRMATION: ${{ inputs.confirmation }}

jobs:
  # No environment here: a typo/missing environment must not auto-create an unprotected one.
  prerequisite-gate:
    if: github.repository_id == '1437714333' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install without Cloudflare credentials
        run: bun install --frozen-lockfile
      - name: Verify mode, exact main, dispatch identity, protected environment and green CI
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun scripts/ingest-error-alert-github.ts
          echo "environment=ingest-alerting-production" >> "$GITHUB_OUTPUT"

  alerting:
    needs: prerequisite-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ needs.prerequisite-gate.outputs.environment }}
    env:
      CLOUDFLARE_ACCOUNT_ID: f7232cb80f6fab86a95426302af243e4
      INGEST_ALERT_WEBHOOK_ID: ${{ vars.INGEST_ALERT_WEBHOOK_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install without Cloudflare credentials
        run: bun install --frozen-lockfile
      - name: Recheck live gates and the recorded environment approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/ingest-error-alert-github.ts --approved
      - name: Plan or apply the alert policy (only step with the Cloudflare token)
        env:
          CLOUDFLARE_ALERTING_API_TOKEN: ${{ secrets.CLOUDFLARE_ALERTING_API_TOKEN }}
        run: bun scripts/ingest-error-alert.ts
      - name: Publish the sanitized receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-error-alert
          path: release-receipt/ingest-error-alert.json
          if-no-files-found: ignore
          retention-days: 30
