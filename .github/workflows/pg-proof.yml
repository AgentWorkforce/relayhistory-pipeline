name: pg-proof
# Real PostgreSQL 15, 16 and 17 (disposable service containers, trust auth, no secrets, no
# hosted service): the migrator's role, readiness and authority guards, end to end,
# through scripts/pg-proof/role-proof.ts. Each run uploads a machine-verifiable JSON
# (head SHA, server version, each case's pass/fail) and its log.
on:
  pull_request:
  push:
    # release/schema-*: the protected release anchor branches (a held-step target_sha
    # needs green push runs on its own branch; scripts/schema-release-github.ts).
    branches: [main, 'release/schema-*']
permissions:
  contents: read
concurrency:
  # One live run per pull request: a new push cancels the previous head's run.
  # Pushes to main (and any non-PR event) are grouped by sha and never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  real-postgres:
    name: real PostgreSQL ${{ matrix.pg }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          # Disposable container: trust auth means no credential exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      # The literal PR head commit, not the synthetic merge ref, as in ci.yml.
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the commit under test
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "commit under test: $actual (expected $EXPECTED), PostgreSQL ${{ matrix.pg }}" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: psql client
        run: psql --version
      - name: RDS setup refuses PostgreSQL 15 before changing roles
        if: matrix.pg == '15'
        run: |
          for file in rds_owner_function_default_revoke.sql rds_migration_roles.sql hoopdb_runtime_role_rds.sql; do
            if psql -X -h 127.0.0.1 -p 5432 -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -v migration_owner=postgres \
              -v runtime_role=g7_rds_version_probe -v runtime_login=false \
              -f "supabase/bootstrap/$file" > rds-version-refusal.log 2>&1; then
              echo "RDS setup unexpectedly accepted PostgreSQL 15: $file"
              exit 1
            fi
            grep -Eq 'ERROR:[[:space:]]+0A000:' rds-version-refusal.log
            echo "$file refused PostgreSQL 15 with SQLSTATE 0A000" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      # Before the role proofs, which lock the superuser down. The suite creates
      # and drops its own database, so it leaves nothing behind for them.
      - name: SearchIndexAdapter conformance (postgres adapter, real server)
        env:
          SEARCH_CONFORMANCE_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: bun run --filter @96bulls/pipeline test test/search-index-postgres-real.test.ts
      - name: Prove auth upgrade, T0 bootstrap and switch-only membership
        env:
          PGPROOF_AUTH_UPGRADE_DISPOSABLE: "1"
          PGPROOF_HOST: 127.0.0.1
          PGPROOF_PORT: "5432"
          PGPROOF_SUPERUSER: postgres
          PGPROOF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PGPROOF_OUT: auth-upgrade-pg${{ matrix.pg }}.json
        run: |
          set -o pipefail
          bun scripts/pg-proof/auth-upgrade-proof.ts 2>&1 | tee auth-upgrade-pg${{ matrix.pg }}.log
      - name: Run the real-PostgreSQL proof
        env:
          PGPROOF_HOST: 127.0.0.1
          PGPROOF_PORT: "5432"
          PGPROOF_SUPERUSER: postgres
          PGPROOF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PGPROOF_OUT: pg-proof-pg${{ matrix.pg }}.json
        run: |
          set -o pipefail
          bun scripts/pg-proof/role-proof.ts 2>&1 | tee pg-proof-pg${{ matrix.pg }}.log
      - name: Check the results file names this head and this server
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          f=pg-proof-pg${{ matrix.pg }}.json
          jq -e --arg head "$EXPECTED" --argjson major ${{ matrix.pg }} \
            '.head == $head and .pg_major == $major and .failed == 0 and .passed > 0 and (.cases | all(.pass))' "$f"
          auth=auth-upgrade-pg${{ matrix.pg }}.json
          jq -e --arg head "$EXPECTED" --argjson major ${{ matrix.pg }} \
            '.head == $head and .pg_major == $major and .failed == 0 and .passed >= 12 and (.cases | all(.pass))' "$auth"
          jq -r '"\(.passed) passed, \(.failed) failed on PostgreSQL \(.pg_version) at \(.head)"' "$f" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg-proof-pg${{ matrix.pg }}
          path: |
            pg-proof-pg${{ matrix.pg }}.json
            pg-proof-pg${{ matrix.pg }}.log
            auth-upgrade-pg${{ matrix.pg }}.json
            auth-upgrade-pg${{ matrix.pg }}.log

  rds-emulated-postgres:
    # The managed-RDS HoopDb profile (HOOPDB_DB_MODE=rds) on disposable PostgreSQL 16/17
    # whose bootstrap superuser is named rdsadmin, so PostgreSQL's automatic PG16+
    # creator edges carry rdsadmin as grantor, as on RDS. An emulation, not RDS: the
    # live RDS gates are listed in the bootstrap runbook.
    name: managed-RDS profile (emulated, PostgreSQL ${{ matrix.pg }})
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          # Disposable container: trust auth means no credential exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: rdsadmin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rdsadmin -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the commit under test
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "commit under test: $actual (expected $EXPECTED), RDS emulation PostgreSQL ${{ matrix.pg }}" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Prove the rds profile, its drift refusals and its mode binding
        env:
          PGPROOF_HOST: 127.0.0.1
          PGPROOF_PORT: "5432"
          PGPROOF_SUPERUSER: rdsadmin
          PGPROOF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PGPROOF_OUT: rds-profile-proof.json
        run: |
          set -o pipefail
          bun scripts/pg-proof/rds-profile-proof.ts 2>&1 | tee rds-profile-proof.log
      - name: Check the results file names this head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          jq -e --arg head "$EXPECTED" --argjson major ${{ matrix.pg }} \
            '.head == $head and .tracked_tree_clean == true and .pg_major == $major and .bootstrap_superuser == "rdsadmin" and .failed == 0 and .passed >= 26 and (.cases | all(.pass))' rds-profile-proof.json
          jq -r '"\(.passed) passed, \(.failed) failed on PostgreSQL \(.pg_version) (rds emulation) at \(.head)"' rds-profile-proof.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rds-profile-proof-pg${{ matrix.pg }}
          path: |
            rds-profile-proof.json
            rds-profile-proof.log

  brief-postgres:
    name: brief publication PostgreSQL ${{ matrix.pg }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          # Disposable container: trust auth means no credential exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the commit under test
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "commit under test: $actual (expected $EXPECTED), PostgreSQL ${{ matrix.pg }}" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Prove default-off brief publication does not serialize directory writers
        env:
          SESSION_INGEST_TEST_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: bun test src/session-pipeline/__tests__/brief-documents.postgres.test.ts
      - name: Prove the lazy claim reads the seat clock without serializing other users' claims (043500)
        env:
          SESSION_INGEST_TEST_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: bun test --timeout 300000 src/session-ingest/__tests__/claim-clock-lock.postgres.test.ts
      - name: Prove the self-host erase serializes with a concurrent claim on the fence lock (044010)
        env:
          SESSION_INGEST_TEST_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: |
          # pg-proof checks out the PR head; heads predating this step lack the test. Remove once no open PR predates it.
          if [ ! -f src/session-ingest/__tests__/selfhost-erase-lock.postgres.test.ts ]; then
            echo "::warning title=pg-proof::selfhost-erase-lock.postgres.test.ts absent at this head; forward-merge main to run the erase lock proof"
            exit 0
          fi
          bun test --timeout 300000 src/session-ingest/__tests__/selfhost-erase-lock.postgres.test.ts
      - name: Prove one session's buffered stages answer under 1 s on a 167k-batch backlog via the records GIN (044040)
        env:
          SESSION_INGEST_TEST_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: |
          # pg-proof checks out the PR head; heads predating 044040 lack the test. Remove once no open PR predates it.
          if [ ! -f src/session-read-api/__tests__/buffered-stages-latency.postgres.test.ts ]; then
            echo "::warning title=pg-proof::buffered-stages-latency.postgres.test.ts absent at this head; forward-merge main to run the 044040 latency proof"
            exit 0
          fi
          bun test --timeout 900000 src/session-read-api/__tests__/buffered-stages-latency.postgres.test.ts
      - name: Prove the acquisition installer login refuses a superuser SET SESSION AUTHORIZATION (pg_stat_activity usename)
        env:
          ACQUISITION_LOGIN_TEST_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: |
          # pg-proof checks out the PR head; heads predating 67d1786d (#370) lack this test. Remove once no open PR predates 67d1786d.
          if [ ! -f src/acquisition/__tests__/db-login.postgres.test.ts ]; then
            echo "::warning title=pg-proof::db-login.postgres.test.ts absent at this head (PR predates #370); forward-merge main to run the installer login proof"
            exit 0
          fi
          bun test --timeout 300000 src/acquisition/__tests__/db-login.postgres.test.ts
      # Service containers cannot take server flags, so the 53200 causal proof gets its own disposable,
      # loopback-only, trust-auth container (same image as the service above, no credential anywhere).
      - name: Start a lock-constrained PostgreSQL for the 043500 advisory-footprint proof
        id: pg_lock_constrained
        env:
          PG_LOCK_NAME: pg-lock-constrained-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pg }}
        run: |
          # Per-run/per-matrix name and an OS-assigned loopback port: concurrent matrix jobs on a persistent
          # self-hosted runner must not collide on a container name or host port.
          docker run -d --name "$PG_LOCK_NAME" -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1:0:5432 \
            postgres:${{ matrix.pg }} -c max_locks_per_transaction=64 -c max_connections=20
          port="$(docker port "$PG_LOCK_NAME" 5432/tcp | head -n1)"; port="${port##*:}"
          case "$port" in ''|*[!0-9]*) echo "could not read the assigned host port"; docker logs "$PG_LOCK_NAME"; exit 1;; esac
          echo "port=$port" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 60); do docker exec "$PG_LOCK_NAME" pg_isready -U postgres -h 127.0.0.1 && exit 0; sleep 2; done
          docker logs "$PG_LOCK_NAME"; exit 1
      - name: Prove bounded advisory locks never exhaust a constrained lock table (043500, no 53200)
        env:
          SESSION_INGEST_TEST_PG_URL: postgres://postgres@127.0.0.1:${{ steps.pg_lock_constrained.outputs.port }}/postgres
          CLAIM_CLOCK_LOCK_EXPECT_CONSTRAINED: "1"
        run: bun test --timeout 300000 src/session-ingest/__tests__/claim-clock-lock.postgres.test.ts
      - name: Remove the lock-constrained PostgreSQL
        if: always()
        env:
          PG_LOCK_NAME: pg-lock-constrained-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.pg }}
        run: docker rm -f "$PG_LOCK_NAME" || true
  acquisition-owner-postgres:
    name: acquisition owner contract PostgreSQL ${{ matrix.pg }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          # Disposable container: trust auth means no credential exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the commit under test
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "commit under test: $actual (expected $EXPECTED), PostgreSQL ${{ matrix.pg }}" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Prove the dormant acquisition owner contract (docs/ingest-acquisition-owner.md)
        env:
          SESSION_INGEST_TEST_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: bun test --timeout 120000 src/session-ingest/__tests__/acquisition-owner.postgres.test.ts
  ingest-postgres:
    # The session-ingest publication suite (including the managed-canary guard fixture,
    # src/session-ingest/__tests__/fixtures/publication-canary-guard.sql) and the
    # frontier-plan capture on real PostgreSQL. Both describe.skipIf() without their
    # connection env, so each step also fails when anything was skipped.
    name: ingest publication and frontier PostgreSQL ${{ matrix.pg }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          # Disposable container: trust auth means no credential exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      NO_COLOR: "1"
      # The MinIO digest pinned in versions.lock.json and stacks/local/topology.ts.
      FRONTIER_MINIO_IMAGE: cgr.dev/chainguard/minio@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
      FRONTIER_MINIO_NAME: frontier-minio-${{ github.run_id }}-${{ github.run_attempt }}-pg${{ matrix.pg }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the commit under test
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "commit under test: $actual (expected $EXPECTED), PostgreSQL ${{ matrix.pg }}" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Publication admission and canary guard on real PostgreSQL
        env:
          SESSION_INGEST_TEST_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: |
          set -o pipefail
          log=publication-pg${{ matrix.pg }}.log
          bun test src/session-ingest/__tests__/publication.postgres.test.ts src/session-ingest/__tests__/operator-session-erase.postgres.test.ts src/session-ingest/__tests__/operator-session-erase-runtime.postgres.test.ts src/session-erase/__tests__/search-login.postgres.test.ts src/session-erase/__tests__/user-erase.postgres.test.ts 2>&1 | tee "$log"
          # A green run must have executed tests, not skipped them.
          grep -Eq '^ *[1-9][0-9]* pass$' "$log"
          if grep -Eq '^ *[1-9][0-9]* skip$' "$log"; then echo "tests were skipped"; exit 1; fi
          grep -E '^ *[0-9]+ (pass|fail)$' "$log" | tr -s ' ' | paste -sd, | sed "s/^/publication PostgreSQL ${{ matrix.pg }}:/" >> "$GITHUB_STEP_SUMMARY"
      # MinIO needs a command (server /data), which job services cannot pass, so it runs
      # here: loopback-only, random host port, tmpfs data, throwaway per-run credentials
      # that live only in this step's environment. The cleanup step removes it.
      - name: Frontier-plan capture on real PostgreSQL and versioned MinIO
        env:
          FRONTIER_TEST_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
          FRONTIER_TEST_S3_BUCKET: frontier-plan-fixture
        run: |
          set -euo pipefail
          FRONTIER_TEST_S3_ACCESS_KEY="frontier-$(openssl rand -hex 6)"
          FRONTIER_TEST_S3_SECRET_KEY="$(openssl rand -hex 24)"
          echo "::add-mask::$FRONTIER_TEST_S3_SECRET_KEY"
          export FRONTIER_TEST_S3_ACCESS_KEY FRONTIER_TEST_S3_SECRET_KEY
          MINIO_ROOT_USER="$FRONTIER_TEST_S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$FRONTIER_TEST_S3_SECRET_KEY" \
            docker run -d --name "$FRONTIER_MINIO_NAME" -p 127.0.0.1::9000 --tmpfs /data:rw,mode=1777 \
            -e MINIO_ROOT_USER -e MINIO_ROOT_PASSWORD -e MINIO_BROWSER=off \
            "$FRONTIER_MINIO_IMAGE" server /data --address :9000 \
            < /dev/null > /dev/null
          hostport="$(docker port "$FRONTIER_MINIO_NAME" 9000/tcp | grep '^127\.0\.0\.1:' | head -1)"
          export FRONTIER_TEST_S3_ENDPOINT="http://$hostport"
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "$FRONTIER_TEST_S3_ENDPOINT/minio/health/ready"; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then docker logs "$FRONTIER_MINIO_NAME"; exit 1; fi
          # Create the bucket and enable versioning with the repository's own SigV4 signer.
          # The embedded JavaScript expands its own template literals.
          # shellcheck disable=SC2016
          bun -e '
            import { signRequest } from "./packages/object-store/src/sigv4.ts";
            import { createHash } from "node:crypto";
            const env = process.env;
            const credentials = { accessKeyId: env.FRONTIER_TEST_S3_ACCESS_KEY, secretAccessKey: env.FRONTIER_TEST_S3_SECRET_KEY };
            const s3 = async (method, suffix, body = "") => {
              const url = new URL(`${env.FRONTIER_TEST_S3_ENDPOINT}/${env.FRONTIER_TEST_S3_BUCKET}${suffix}`);
              const headers = new Headers({ "content-type": "application/xml" });
              await signRequest({ method, url, headers, payloadSha256: createHash("sha256").update(body).digest("hex"), region: "us-east-1", credentials });
              const response = await fetch(url, { method, headers, ...(body ? { body } : {}), signal: AbortSignal.timeout(10_000) });
              if (!response.ok) throw new Error(`fixture_s3 ${method} ${suffix} ${response.status} ${await response.text()}`);
            };
            await s3("PUT", "");
            await s3("PUT", "?versioning", `<VersioningConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Status>Enabled</Status></VersioningConfiguration>`);
          '
          log=frontier-plan-pg${{ matrix.pg }}.log
          bun test src/session-ingest/__tests__/frontier-plan.postgres.test.ts src/session-erase/__tests__/selfhost-eraser.minio.test.ts src/session-erase/__tests__/operator-flow.minio.test.ts 2>&1 | tee "$log"
          grep -Eq '^ *[1-9][0-9]* pass$' "$log"
          if grep -Eq '^ *[1-9][0-9]* skip$' "$log"; then echo "tests were skipped"; exit 1; fi
          grep -E '^ *[0-9]+ (pass|fail)$' "$log" | tr -s ' ' | paste -sd, | sed "s/^/frontier-plan PostgreSQL ${{ matrix.pg }}:/" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the MinIO fixture
        if: always()
        run: docker rm -f "$FRONTIER_MINIO_NAME" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-postgres-pg${{ matrix.pg }}
          path: |
            publication-pg${{ matrix.pg }}.log
            frontier-plan-pg${{ matrix.pg }}.log
          if-no-files-found: ignore

  consumer-writer:
    name: self-host pipeline consumer writer proof (PG ${{ matrix.pg }})
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          # Disposable container: trust auth means no credential exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the commit under test
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "commit under test: $actual (expected $EXPECTED), PostgreSQL ${{ matrix.pg }}" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Create the CREATEROLE owner database (production-shaped)
        env:
          PG_SUPER_URL: postgres://postgres@127.0.0.1:5432/postgres
          PG_SUPER_DB_URL: postgres://postgres@127.0.0.1:5432/consumer336
          PG_HOOP_URL: postgres://hoop@127.0.0.1:5432/consumer336
        run: |
          bun - <<'BUN'
            import pg from "pg";
            import { readFileSync } from "node:fs";
            const admin = new pg.Pool({ connectionString: process.env.PG_SUPER_URL });
            await admin.query("CREATE ROLE hoop LOGIN CREATEROLE");
            await admin.query("CREATE DATABASE consumer336 OWNER hoop");
            await admin.end();
            // Base roles once, as the superuser: the shim service_role
            // carries BYPASSRLS, which the hoop owner cannot create (and on
            // PG16+ hoop cannot create the worker/verifier/ingest/read-api
            // roles either). The suite skips these when its sentinel roles
            // already exist.
            const sup = new pg.Pool({ connectionString: process.env.PG_SUPER_DB_URL });
            const hoop = new pg.Pool({ connectionString: process.env.PG_HOOP_URL });
            const { SESSION_BOOTSTRAP_FILES } = await import("./src/hoopdb/session-bootstrap-chain.ts");
            const sql = (p) => readFileSync(p, "utf8").split("\n").filter((l) => !l.startsWith("\\")).join("\n");
            await sup.query(sql("supabase/tests/supabase_shim.sql"));
            // Single-sourced bootstrap chain: the grant migration FAILs
            // without a grantee (migrations never create roles), so the T0
            // setup provisions it exactly like migrate's bootstrap step. hoop
            // provisions the consumer bare role itself: it must own the role
            // (the rollback test drops it), and the bootstrap guard pins the
            // invoker edge.
            for (const f of SESSION_BOOTSTRAP_FILES)
              await (f.endsWith("session_consumer_roles.sql") ? hoop : sup).query(sql(f));
            await sup.query("CREATE EXTENSION IF NOT EXISTS pg_trgm");
            await sup.query("CREATE EXTENSION IF NOT EXISTS btree_gin");
            await sup.end();
            await hoop.end();
          BUN
      - name: Prove the owner bootstrap, dedicated role, and writer surface on real Postgres
        env:
          # The native suite self-provisions the migrated schema when it is
          # absent, then bootstraps and proves the role exactly as written.
          # Trust auth means neither URL carries a credential. The bootstrap
          # runs as the CREATEROLE non-superuser owner, exactly like the
          # operator model (a superuser creator gets no membership edge to
          # pin, so the suite would prove less as postgres).
          SESSION_PIPELINE_TEST_OPERATOR_PG_URL: postgres://postgres@127.0.0.1:5432/consumer336
          SESSION_PIPELINE_TEST_PG_URL: postgres://hoop@127.0.0.1:5432/consumer336
          SESSION_PIPELINE_TEST_WRITER_PG_URL: postgres://search_consumer_runtime@127.0.0.1:5432/consumer336
        run: bun test --timeout 300000 src/session-pipeline/__tests__/session-consumer-writer.postgres.test.ts
  consumer-lease:
    name: canonical consumer lease proof (PG ${{ matrix.pg }})
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Fresh superuser container: the proof creates/drops its own database.
      - name: Canonical consumer lease proof (own database)
        env:
          PROOF_DISPOSABLE: "1"
        run: |
          set -euo pipefail
          for scheme in legacy-prefix-v1 scope-v1; do
            PROOF_PARTITION_SCHEME="$scheme" bun scripts/proof-canonical-consumer-lease.ts 5432 2>&1 |
              tee consumer-lease-pg${{ matrix.pg }}-$scheme.log
            grep -q "ALL PASS" consumer-lease-pg${{ matrix.pg }}-$scheme.log
          done
  buffered-feed-login-postgres:
    name: buffered search feed login and gate PostgreSQL ${{ matrix.pg }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          # Disposable container: trust auth means no credential exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the commit under test
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "commit under test: $actual (expected $EXPECTED), PostgreSQL ${{ matrix.pg }}" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Migrates its own scratch database (043860 + 043870 up/down/up); the owner-buffered privacy
      # fixtures already run in real-postgres via scripts/pg-proof/role-proof.ts, so they are not repeated here.
      - name: Prove the buffered search feed RPCs admit only the runtime login and gate_for only the read API role (043860, 043870)
        env:
          SESSION_INGEST_TEST_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: |
          # pg-proof checks out the PR head; heads predating this job lack the test. Remove once no open PR predates it.
          if [ ! -f src/session-pipeline/__tests__/buffered-feed-login.postgres.test.ts ]; then
            echo "::warning title=pg-proof::buffered-feed-login.postgres.test.ts absent at this head; forward-merge main to run the feed login proof"
            exit 0
          fi
          bun test --timeout 300000 src/session-pipeline/__tests__/buffered-feed-login.postgres.test.ts

  consumer-credential-probe:
    name: consumer credential probe (PG 17)
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Prove exact-helper non-superuser bootstrap and causal refusals
        shell: bash
        run: |
          set -euo pipefail
          fixture=$(docker run --detach --memory=1g --cpus=1 -p 127.0.0.1::5432 -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17 postgres -c cluster_name=consumer-credential-proof)
          trap 'docker rm -fv "$fixture" >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if docker exec "$fixture" pg_isready -U postgres; then break; fi
            sleep 1
          done
          port=$(docker port "$fixture" 5432/tcp | awk -F: '{print $NF}')
          CONSUMER_CREDENTIAL_PROBE_NATIVE=true CONSUMER_CREDENTIAL_PROBE_PG_PORT="$port" \
            bun test --timeout 120000 src/session-pipeline/__tests__/consumer-credential-probe.postgres.test.ts
