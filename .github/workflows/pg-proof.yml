name: pg-proof
# Real PostgreSQL 15, 16 and 17 (disposable service containers, trust auth, no secrets, no
# hosted service): the migrator's role, readiness and authority guards, end to end,
# through scripts/pg-proof/role-proof.ts. Each run uploads a machine-verifiable JSON
# (head SHA, server version, each case's pass/fail) and its log.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  real-postgres:
    name: real PostgreSQL ${{ matrix.pg }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          # Disposable container: trust auth means no credential exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      # The literal PR head commit, not the synthetic merge ref, as in ci.yml.
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the commit under test
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "commit under test: $actual (expected $EXPECTED), PostgreSQL ${{ matrix.pg }}" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: psql client
        run: psql --version
      - name: RDS setup refuses PostgreSQL 15 before changing roles
        if: matrix.pg == '15'
        run: |
          for file in rds_owner_function_default_revoke.sql rds_migration_roles.sql hoopdb_runtime_role_rds.sql; do
            if psql -X -h 127.0.0.1 -p 5432 -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -v VERBOSITY=verbose -v migration_owner=postgres \
              -v runtime_role=g7_rds_version_probe -v runtime_login=false \
              -f "supabase/bootstrap/$file" > rds-version-refusal.log 2>&1; then
              echo "RDS setup unexpectedly accepted PostgreSQL 15: $file"
              exit 1
            fi
            grep -Eq 'ERROR:[[:space:]]+0A000:' rds-version-refusal.log
            echo "$file refused PostgreSQL 15 with SQLSTATE 0A000" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      # Before the role proofs, which lock the superuser down. The suite creates
      # and drops its own database, so it leaves nothing behind for them.
      - name: SearchIndexAdapter conformance (postgres adapter, real server)
        env:
          SEARCH_CONFORMANCE_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: bun run --filter @96bulls/pipeline test test/search-index-postgres-real.test.ts
      - name: Prove auth upgrade, T0 bootstrap and switch-only membership
        env:
          PGPROOF_AUTH_UPGRADE_DISPOSABLE: "1"
          PGPROOF_HOST: 127.0.0.1
          PGPROOF_PORT: "5432"
          PGPROOF_SUPERUSER: postgres
          PGPROOF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PGPROOF_OUT: auth-upgrade-pg${{ matrix.pg }}.json
        run: |
          set -o pipefail
          bun scripts/pg-proof/auth-upgrade-proof.ts 2>&1 | tee auth-upgrade-pg${{ matrix.pg }}.log
      - name: Run the real-PostgreSQL proof
        env:
          PGPROOF_HOST: 127.0.0.1
          PGPROOF_PORT: "5432"
          PGPROOF_SUPERUSER: postgres
          PGPROOF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PGPROOF_OUT: pg-proof-pg${{ matrix.pg }}.json
        run: |
          set -o pipefail
          bun scripts/pg-proof/role-proof.ts 2>&1 | tee pg-proof-pg${{ matrix.pg }}.log
      - name: Check the results file names this head and this server
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          f=pg-proof-pg${{ matrix.pg }}.json
          jq -e --arg head "$EXPECTED" --argjson major ${{ matrix.pg }} \
            '.head == $head and .pg_major == $major and .failed == 0 and .passed > 0 and (.cases | all(.pass))' "$f"
          auth=auth-upgrade-pg${{ matrix.pg }}.json
          jq -e --arg head "$EXPECTED" --argjson major ${{ matrix.pg }} \
            '.head == $head and .pg_major == $major and .failed == 0 and .passed >= 12 and (.cases | all(.pass))' "$auth"
          jq -r '"\(.passed) passed, \(.failed) failed on PostgreSQL \(.pg_version) at \(.head)"' "$f" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg-proof-pg${{ matrix.pg }}
          path: |
            pg-proof-pg${{ matrix.pg }}.json
            pg-proof-pg${{ matrix.pg }}.log
            auth-upgrade-pg${{ matrix.pg }}.json
            auth-upgrade-pg${{ matrix.pg }}.log

  rds-emulated-postgres:
    # The managed-RDS HoopDb profile (HOOPDB_DB_MODE=rds) on disposable PostgreSQL 16/17
    # whose bootstrap superuser is named rdsadmin, so PostgreSQL's automatic PG16+
    # creator edges carry rdsadmin as grantor, as on RDS. An emulation, not RDS: the
    # live RDS gates are listed in the bootstrap runbook.
    name: managed-RDS profile (emulated, PostgreSQL ${{ matrix.pg }})
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          # Disposable container: trust auth means no credential exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: rdsadmin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rdsadmin -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the commit under test
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "commit under test: $actual (expected $EXPECTED), RDS emulation PostgreSQL ${{ matrix.pg }}" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Prove the rds profile, its drift refusals and its mode binding
        env:
          PGPROOF_HOST: 127.0.0.1
          PGPROOF_PORT: "5432"
          PGPROOF_SUPERUSER: rdsadmin
          PGPROOF_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PGPROOF_OUT: rds-profile-proof.json
        run: |
          set -o pipefail
          bun scripts/pg-proof/rds-profile-proof.ts 2>&1 | tee rds-profile-proof.log
      - name: Check the results file names this head
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          jq -e --arg head "$EXPECTED" --argjson major ${{ matrix.pg }} \
            '.head == $head and .tracked_tree_clean == true and .pg_major == $major and .bootstrap_superuser == "rdsadmin" and .failed == 0 and .passed >= 21 and (.cases | all(.pass))' rds-profile-proof.json
          jq -r '"\(.passed) passed, \(.failed) failed on PostgreSQL \(.pg_version) (rds emulation) at \(.head)"' rds-profile-proof.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rds-profile-proof-pg${{ matrix.pg }}
          path: |
            rds-profile-proof.json
            rds-profile-proof.log

  brief-postgres:
    name: brief publication PostgreSQL ${{ matrix.pg }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          # Disposable container: trust auth means no credential exists anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record the commit under test
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "commit under test: $actual (expected $EXPECTED), PostgreSQL ${{ matrix.pg }}" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$actual" = "$EXPECTED"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Prove default-off brief publication does not serialize directory writers
        env:
          SESSION_INGEST_TEST_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: bun test src/session-pipeline/__tests__/brief-documents.postgres.test.ts
      - name: Prove the lazy claim reads the seat clock without serializing other users' claims (043500)
        env:
          SESSION_INGEST_TEST_PG_URL: postgres://postgres@127.0.0.1:5432/postgres
        run: bun test --timeout 300000 src/session-ingest/__tests__/claim-clock-lock.postgres.test.ts
  consumer-lease:
    name: canonical consumer lease proof (PG ${{ matrix.pg }})
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Fresh superuser container: the proof creates/drops its own database.
      - name: Canonical consumer lease proof (own database)
        env:
          PROOF_DISPOSABLE: "1"
        run: |
          set -euo pipefail
          for scheme in legacy-prefix-v1 scope-v1; do
            PROOF_PARTITION_SCHEME="$scheme" bun scripts/proof-canonical-consumer-lease.ts 5432 2>&1 |
              tee consumer-lease-pg${{ matrix.pg }}-$scheme.log
            grep -q "ALL PASS" consumer-lease-pg${{ matrix.pg }}-$scheme.log
          done
