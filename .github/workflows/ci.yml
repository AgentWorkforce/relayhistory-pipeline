name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (root + workspaces)
        run: bun install --frozen-lockfile
      - name: Typecheck packages/pipeline
        run: bun run --filter @96bulls/pipeline typecheck
      - name: Test packages/pipeline (vitest, in-process PGlite; no real database)
        run: bun run --filter @96bulls/pipeline test
      - name: Build packages/object-store
        run: bun run --filter @relayhistory/object-store build
      - name: Test packages/object-store
        run: bun run --filter @relayhistory/object-store test
      - name: Typecheck the stack (src, stacks, alchemy.run.ts)
        run: bunx tsc --noEmit -p tsconfig.json
      - name: Unit tests (stack)
        run: bun test
      - name: Unit tests (IaC values, stacks/)
        run: bun test ./stacks
      - name: Session directory search through real Postgres and PostgREST
        run: |
          scripts/fetch-postgrest-test-bins.sh "$RUNNER_TEMP/postgrest-bins" >> "$GITHUB_ENV"
      - name: Build the RelayAuth that mints search tokens
        run: |
          # Pinned to relayauth#116 until it merges.
          git clone --quiet https://github.com/AgentWorkforce/relayauth.git "$RUNNER_TEMP/relayauth"
          git -C "$RUNNER_TEMP/relayauth" checkout --quiet 35e2171cd52a5081646188093e9534843161825c
          cd "$RUNNER_TEMP/relayauth"
          npm ci --silent
          npx turbo build --filter=@relayauth/server^...
          echo "RELAYAUTH_DIR=$RUNNER_TEMP/relayauth" >> "$GITHUB_ENV"
      - run: bun test ./integration/session-directory-postgrest --timeout 40000
      - name: Guard - no Helm hooks in any chart or manifest in this repo
        run: |
          # The annotation key is assembled so this file never matches its own guard; .github is excluded as well.
          key="helm.sh/ho""ok"
          ! grep -rn "$key" --include='*.yaml' --include='*.yml' --include='*.tpl' . --exclude-dir=node_modules --exclude-dir=vendor --exclude-dir=.github || (echo "helm hooks are not allowed (Alchemy renders --no-hooks)"; exit 1)
      - name: Guard - nothing secret-like committed
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|inputs\.json|.*\.pem)$' || (echo "secret-like file tracked"; exit 1)
