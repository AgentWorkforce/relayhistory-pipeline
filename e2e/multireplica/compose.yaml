# The local two-replica proof of the ingest edge on the S3 ledger
# (scripts/proof-ingest-edge-multireplica-local.ts, runbooks/ingest-edge-multireplica-proof.md "Local mode"),
# layered over e2e/selfhost/compose.yaml: its Postgres, MinIO, migrations, role bootstrap and Control
# introspection stub, plus TWO ingest-edge processes (ingest-r1, ingest-r2) with identical settings against the
# same bucket and key root: INGEST_LEDGER=s3, async admission, the per-replica tenant limit with halved caps,
# INGEST_LEDGER_LOG_COMMIT off, and the direct upload inbox on. Every credential (and the witness key) is
# generated per run by the script and passed in the environment. Loopback-only ephemeral host ports.
x-services-image: &services-image
  image: ${E2E_IMAGE:-96bulls/services:e2e}
x-ingest: &ingest
  <<: *services-image
  environment:
    SESSION_POSTGRES_TLS_PROFILE: custom-ca
    SESSION_POSTGRES_CA_FILE: /certs/ca.crt
    SESSION_POSTGRES_CA_SHA256: ${E2E_CA_SHA256:?}
    ALLOW_IN_CLUSTER_HTTP: "true"
    LOCKER_BUCKET: transcripts
    LOCKER_PROVIDER: s3
    LOCKER_ENDPOINT: http://minio:9000
    LOCKER_REGION: us-east-1
    LOCKER_ACCESS_KEY_ID: ${E2E_MINIO_USER:?}
    LOCKER_SECRET_ACCESS_KEY: ${E2E_MINIO_PASSWORD:?}
    PIPELINE_KEY_PREFIX: 96bulls
    PIPELINE_ORG_FROM_PREFIX: "true"
    RELAYCONTROL_INTROSPECT_URL: http://control.e2e.svc:8090
    RELAYCONTROL_INTROSPECT_SECRET: ${E2E_INTROSPECT_SECRET:?}
    SERVICE: session-ingest
    RELAYHISTORY_SELFHOST_INGEST: "true"
    RELAYHISTORY_INGEST_PORT: "8081"
    RELAYHISTORY_INGEST_ORIGIN: https://history.e2e.test
    RELAYHISTORY_INGEST_DATABASE_URL: postgresql://bulls96_session_ingest:${E2E_INGEST_PASSWORD:?}@db:5432/postgres
    INGEST_LEDGER: s3
    INGEST_LEDGER_LOG_COMMIT: "off"
    SELFHOST_INGEST_ADMISSION: async
    SELFHOST_ADMISSION_CONCURRENCY: ${E2E_MRP_CONCURRENCY:-8}
    SELFHOST_ADMISSION_SCAN_MS: ${E2E_MRP_SCAN_MS:-2000}
    INGEST_S3_TENANT_LIMIT: "on"
    INGEST_ASYNC_MAX_PER_ORG: ${E2E_MRP_ASYNC_MAX_PER_ORG:-2}
    INGEST_MAX_PER_USER: ${E2E_MRP_MAX_PER_USER:-2}
    INGEST_MAX_PER_ORG: ${E2E_MRP_MAX_PER_ORG:-16}
    HISTORY_UPLOAD_DIRECT: "on"
    UPLOAD_WITNESS_KEY: ${E2E_UPLOAD_WITNESS_KEY:?}
  volumes:
    - ${E2E_CERTS_DIR:?}:/certs:ro
  ports: ["127.0.0.1::8081"]
  depends_on:
    roles: { condition: service_completed_successfully }
    control-stub: { condition: service_started }
    # The S3 ledger proves conditional writes against the bucket at startup, so the bucket must exist first.
    locker-init: { condition: service_completed_successfully }
  restart: on-failure:5
services:
  minio:
    ports: ["127.0.0.1::9000"]
  ingest-r1: *ingest
  ingest-r2: *ingest
